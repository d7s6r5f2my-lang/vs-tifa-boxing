<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>VS TIFA 3D BETA</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;z-index:5;top:max(9px,env(safe-area-inset-top));left:10px;right:10px;display:grid;grid-template-columns:1fr 60px 1fr;gap:7px;text-shadow:0 2px 5px #000}.name{font-size:10px;font-weight:900}.r{text-align:right}.bar{height:14px;border:1px solid #ffffff66;background:#080b11cc}.fill{height:100%;width:100%;transition:.15s}.enemy{background:linear-gradient(90deg,#44d665,#a7ff78)}.player{background:linear-gradient(90deg,#ff3a50,#ff9877)}#time{text-align:center;font-size:27px;font-weight:1000}.controls{position:fixed;z-index:8;left:7px;right:7px;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.controls button{min-height:60px;border:1px solid #ffffff45;border-radius:12px;background:#0d1420e8;color:#fff;font-size:9px;font-weight:900}.controls b{display:block;font-size:20px}.atk{border-bottom:3px solid #ff5064!important}.def{border-bottom:3px solid #59caff!important}#start,#result,#loading{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:#03050ae8}#result{display:none}#loading{z-index:30}.card{text-align:center;width:min(88vw,410px);padding:28px 20px;background:#0b111bea;border:1px solid #ffffff35;border-radius:18px}.card h1{font-size:50px;margin:0;font-style:italic}.sub{color:#c9a8ff;font-size:11px;font-weight:900;letter-spacing:.12em;margin:7px 0 18px}.primary{padding:15px 48px;border:0;border-radius:10px;background:linear-gradient(#8a55ee,#5a29b9);color:white;font-size:22px;font-weight:1000}.msg{position:fixed;z-index:7;left:50%;top:18%;transform:translateX(-50%);font-size:40px;font-weight:1000;font-style:italic;text-shadow:0 0 18px #7444ff,0 3px 6px #000;white-space:nowrap}.tag{position:fixed;z-index:6;left:10px;bottom:84px;font-size:9px;padding:5px 8px;border-radius:7px;background:#050910bb}.tell{position:fixed;z-index:7;left:50%;top:27%;transform:translateX(-50%);font-size:11px;font-weight:900;padding:5px 10px;border:1px solid #ff5268;border-radius:99px;background:#05070bcc;color:#ff8190;opacity:0}.tell.on{opacity:1}</style></head><body><div class="hud"><div><div class="name">TIFA</div><div class="bar"><div id="eh" class="fill enemy"></div></div></div><div id="time">60</div><div><div class="name r">YOU</div><div class="bar"><div id="ph" class="fill player"></div></div></div></div><div id="msg" class="msg"></div><div id="tell" class="tell">ATTACK!</div><div class="tag">REAL 3D BETA · CC0 RIGGED MODEL</div><div class="controls"><button class="atk" data-a="jab"><b>🥊</b>JAB</button><button class="atk" data-a="straight"><b>💥</b>STRAIGHT</button><button class="atk" data-a="body"><b>↘</b>BODY</button><button class="def" id="guard"><b>◆</b>GUARD</button><button class="def" id="sway"><b>↔</b>SWAY</button></div><div id="loading"><div class="card"><h1>3D</h1><div class="sub" id="loadtxt">MODEL LOADING…</div></div></div><div id="start"><div class="card"><h1>VS TIFA</h1><div class="sub">REAL-TIME 3D BETA</div><button id="fight" class="primary">FIGHT</button></div></div><div id="result"><div class="card"><h1 id="res">RESULT</h1><div class="sub">3D BETA</div><button id="again" class="primary">REMATCH</button></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080b12);scene.fog=new THREE.Fog(0x080b12,7,18);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,50);camera.position.set(0,1.45,4.25);camera.lookAt(0,1.25,0);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xcad9ff,0x151018,2.2));const key=new THREE.DirectionalLight(0xffffff,3.4);key.position.set(-3,6,4);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x7e9dff,2.3);rim.position.set(4,3,-3);scene.add(rim);const warm=new THREE.PointLight(0xff6b58,20,7);warm.position.set(-3,2,1);scene.add(warm);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,16),new THREE.MeshStandardMaterial({color:0x202833,roughness:.72,metalness:.08}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);for(let i=0;i<3;i++){const y=.58+i*.48;const mat=new THREE.MeshStandardMaterial({color:i===0?0x357fd2:i===1?0xe9edf1:0xc93045,roughness:.4});for(const z of[-1.65,1.65]){const r=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,6,10),mat);r.rotation.z=Math.PI/2;r.position.set(0,y,z);scene.add(r)}}for(const x of[-2.8,2.8])for(const z of[-1.65,1.65]){const p=new THREE.Mesh(new THREE.BoxGeometry(.1,2,.1),new THREE.MeshStandardMaterial({color:0x5e6875,metalness:.5}));p.position.set(x,1,z);scene.add(p)}
let model,bones={},base={},action=null,actionT=0,guarding=false,sway=0;const aliases={lArm:['leftarm','leftupperarm'],rArm:['rightarm','rightupperarm'],lFore:['leftforearm','leftlowerarm'],rFore:['rightforearm','rightlowerarm'],spine:['spine1','spine2','spine'],hips:['hips'],head:['head']};function findBone(keys){let out=null;model.traverse(o=>{if(out||!o.isBone)return;const n=o.name.toLowerCase().replace(/[^a-z]/g,'');if(keys.some(k=>n.includes(k)))out=o});return out}function saveBones(){for(const[k,v]of Object.entries(aliases)){bones[k]=findBone(v);if(bones[k])base[k]=bones[k].quaternion.clone()}}
function tint(){model.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;if(o.material){o.material=o.material.clone();const n=(o.name+' '+o.material.name).toLowerCase();if(n.includes('hair'))o.material.color.set(0x17151b);else if(n.includes('skin')||n.includes('body')){}else{o.material.roughness=.58}}})}
const loader=new GLTFLoader();loader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Michelle.glb',g=>{model=g.scene;scene.add(model);model.scale.setScalar(1.02);model.position.set(0,0,0);model.rotation.y=Math.PI;tint();saveBones();document.getElementById('loading').style.display='none';poseGuard(.72)},undefined,e=>{document.getElementById('loadtxt').textContent='3D MODEL LOAD ERROR';console.error(e)});
function rel(k,x,y,z,t=1){const b=bones[k];if(!b||!base[k])return;const q=base[k].clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z)));b.quaternion.slerp(q,t)}function poseGuard(t=.25){rel('lArm',-.65,0,.72,t);rel('rArm',-.65,0,-.72,t);rel('lFore',-1.25,0,.15,t);rel('rFore',-1.25,0,-.15,t);rel('spine',-.08,0,0,t)}function doAction(a){if(!running||!model)return;action=a;actionT=0;if(a==='jab')hit(6);if(a==='straight')hit(9);if(a==='body')hit(8)}function animatePose(dt){if(!model)return;actionT+=dt;const breath=Math.sin(performance.now()*.004)*.018;model.position.y=breath;model.rotation.z=THREE.MathUtils.lerp(model.rotation.z,sway*.16,.18);if(sway) sway*=.9;if(guarding){poseGuard(.22);return}poseGuard(.16);if(!action)return;const p=Math.min(actionT/(action==='straight'?.34:.27),1),s=Math.sin(p*Math.PI);if(action==='jab'){rel('lArm',-.2,-.2,.15,s);rel('lFore',-.05,0,.05,s);rel('spine',-.08,-.13,0,s*.8)}else if(action==='straight'){rel('rArm',-.12,.25,-.08,s);rel('rFore',-.04,0,-.03,s);rel('spine',-.08,.28,0,s)}else{rel('spine',.28,.2,.08,s);rel('rArm',-.35,.1,-.45,s)}if(p>=1)action=null}
let running=false,eh=100,ph=100,time=60,timer,enemyTimer,canCounter=false;const $=id=>document.getElementById(id);function flash(s){$('msg').textContent=s;setTimeout(()=>{if($('msg').textContent===s)$('msg').textContent=''},500)}function hit(d){const crit=canCounter?1.6:1;eh=Math.max(0,eh-d*crit);$('eh').style.width=eh+'%';if(canCounter){flash('COUNTER!');canCounter=false}camera.position.z=4.12;setTimeout(()=>camera.position.z=4.25,70);if(eh<=0)end(true)}function enemyAttack(){if(!running)return;$('tell').classList.add('on');setTimeout(()=>{if(!running)return;$('tell').classList.remove('on');if(guarding){ph=Math.max(0,ph-2);flash('GUARD')}else if(Math.abs(sway)>.15){flash('DODGE');canCounter=true}else{ph=Math.max(0,ph-8-Math.random()*5);flash('HIT');camera.rotation.z=.025;setTimeout(()=>camera.rotation.z=0,90)}$('ph').style.width=ph+'%';if(ph<=0)end(false)},520)}function start(){eh=ph=100;time=60;running=true;$('eh').style.width=$('ph').style.width='100%';$('start').style.display='none';$('result').style.display='none';flash('FIGHT!');clearInterval(timer);clearInterval(enemyTimer);timer=setInterval(()=>{if(!running)return;time--;$('time').textContent=time;if(time<=0)end(eh<ph)},1000);enemyTimer=setInterval(enemyAttack,1900)}function end(win){running=false;clearInterval(timer);clearInterval(enemyTimer);$('res').textContent=win?'YOU WIN':'YOU LOSE';$('result').style.display='flex'}
document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('pointerdown',()=>doAction(b.dataset.a)));$('guard').addEventListener('pointerdown',()=>guarding=true);$('guard').addEventListener('pointerup',()=>guarding=false);$('guard').addEventListener('pointercancel',()=>guarding=false);$('sway').addEventListener('pointerdown',()=>{sway=sway>0?-1:1});$('fight').onclick=start;$('again').onclick=start;addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let prev=performance.now();function loop(n){requestAnimationFrame(loop);const dt=Math.min((n-prev)/1000,.05);prev=n;animatePose(dt);renderer.render(scene,camera)}requestAnimationFrame(loop);</script></body></html>
