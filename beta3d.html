<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>VS TIFA 3D — CAMERA FIX</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}canvas{position:fixed;inset:0}.hud{position:fixed;z-index:8;top:max(8px,env(safe-area-inset-top));left:9px;right:9px;display:grid;grid-template-columns:1fr 58px 1fr;gap:7px;text-shadow:0 2px 5px #000}.name{font-size:10px;font-weight:900}.r{text-align:right}.bar{height:14px;border:1px solid #fff6;background:#080b11cc}.fill{height:100%;transition:.15s}.eh{height:100%;background:#66df69}.ph{height:100%;background:#ff5368}#time{text-align:center;font-size:27px;font-weight:900}.controls{position:fixed;z-index:9;left:7px;right:7px;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.controls button{min-height:60px;border:1px solid #fff4;border-radius:12px;background:#0d1420ed;color:white;font-weight:900}.msg{position:fixed;z-index:9;left:50%;top:18%;transform:translateX(-50%);font-size:36px;font-weight:900}.tell{position:fixed;z-index:9;left:50%;top:25%;transform:translateX(-50%);opacity:0}.tell.on{opacity:1}#start,#result,#loading{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:#03050ae8}#result{display:none}.card{text-align:center;padding:28px;background:#0b111bea;border-radius:18px}.primary{padding:15px 48px;border:0;border-radius:10px;background:#6c39cf;color:#fff;font-size:22px;font-weight:900}.tag{position:fixed;z-index:8;left:9px;bottom:82px;font-size:9px;background:#050910c9;padding:5px 8px}</style></head><body><div class="hud"><div><div class="name">TIFA</div><div class="bar"><div id="eh" class="eh"></div></div></div><div id="time">60</div><div><div class="name r">YOU</div><div class="bar"><div id="ph" class="ph"></div></div></div></div><div id="msg" class="msg"></div><div id="tell" class="tell">ATTACK!</div><div class="tag">FIRST PERSON CAMERA PASS</div><div class="controls"><button data-a="jab">🥊<br>JAB</button><button data-a="straight">💥<br>STRAIGHT</button><button data-a="body">↘<br>BODY</button><button id="guard">◆<br>GUARD</button><button id="sway">↔<br>SWAY</button></div><div id="loading"><div class="card"><h1>3D</h1><div id="loadtxt">LOADING…</div></div></div><div id="start"><div class="card"><h1>VS TIFA</h1><button id="fight" class="primary">FIGHT</button></div></div><div id="result"><div class="card"><h1 id="res"></h1><button id="again" class="primary">REMATCH</button></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const $=x=>document.getElementById(x),scene=new THREE.Scene();scene.background=new THREE.Color(0x090d15);scene.fog=new THREE.Fog(0x090d15,6,15);const cam=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.08,30);cam.position.set(0,1.38,3.25);cam.lookAt(0,1.35,0);const ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});ren.setPixelRatio(Math.min(devicePixelRatio,1.45));ren.setSize(innerWidth,innerHeight);ren.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(ren.domElement);scene.add(new THREE.HemisphereLight(0xdce7ff,0x171019,2.7));let l=new THREE.DirectionalLight(0xffffff,3.5);l.position.set(-3,5,4);scene.add(l);let floor=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.MeshStandardMaterial({color:0x252d38,roughness:.8}));floor.rotation.x=-Math.PI/2;scene.add(floor);for(let i=0;i<3;i++)for(const z of[-1.7,1.7]){let r=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,5.6,8),new THREE.MeshStandardMaterial({color:[0x347ec9,0xeeeeee,0xc53243][i]}));r.rotation.z=Math.PI/2;r.position.set(0,.55+i*.48,z);scene.add(r)}let model,bones={},base={},act='',at=0,guard=false,sway=0;const alias={la:['leftupperarm','leftarm'],ra:['rightupperarm','rightarm'],lf:['leftlowerarm','leftforearm'],rf:['rightlowerarm','rightforearm'],sp:['spine2','spine1','spine']};function find(a){let o;model.traverse(n=>{if(o||!n.isBone)return;let s=n.name.toLowerCase().replace(/[^a-z]/g,'');if(a.some(k=>s.includes(k)))o=n});return o}function save(){for(const[k,a]of Object.entries(alias)){bones[k]=find(a);if(bones[k])base[k]=bones[k].quaternion.clone()}}function rel(k,x,y,z,t=.2){if(!bones[k])return;let q=base[k].clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z)));bones[k].quaternion.slerp(q,t)}function pose(t=.2){rel('la',-.7,0,.72,t);rel('ra',-.7,0,-.72,t);rel('lf',-1.2,0,.15,t);rel('rf',-1.2,0,-.15,t);rel('sp',-.08,0,0,t)}new GLTFLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Michelle.glb',g=>{model=g.scene;scene.add(model);model.scale.setScalar(1.08);model.position.set(0,0,-.15);model.rotation.y=0;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.material=o.material.clone()}});save();pose(.9);$('loading').style.display='none'},undefined,()=>{$('loadtxt').textContent='MODEL ERROR'});const gloveMat=new THREE.MeshStandardMaterial({color:0xa8172d,roughness:.38}),skin=new THREE.MeshStandardMaterial({color:0xd99d82}),dark=new THREE.MeshStandardMaterial({color:0x111219}),white=new THREE.MeshStandardMaterial({color:0xf2f1ed});const look=new THREE.Group();scene.add(look);function m(g,ma,p,s=[1,1,1]){let o=new THREE.Mesh(g,ma);o.position.set(...p);o.scale.set(...s);look.add(o);return o}/* opponent-facing overlay silhouette */m(new THREE.CapsuleGeometry(.20,.42,8,16),white,[0,1.28,-.42],[1.12,1,.65]);m(new THREE.BoxGeometry(.46,.14,.24),dark,[0,1.02,-.40]);let hair=m(new THREE.CapsuleGeometry(.18,.78,8,16),dark,[0,1.48,-.55],[1.08,1,.7]);hair.position.z=-.58;let gl=m(new THREE.SphereGeometry(.125,18,14),gloveMat,[-.22,1.47,.02]),gr=m(new THREE.SphereGeometry(.125,18,14),gloveMat,[.22,1.47,.02]);/* player's first-person gloves */let pg=new THREE.Group();cam.add(pg);scene.add(cam);let pl=new THREE.Mesh(new THREE.SphereGeometry(.13,16,12),gloveMat),pr=pl.clone();pl.position.set(-.52,-.52,-1.15);pr.position.set(.52,-.52,-1.15);pg.add(pl,pr);let running=false,enemy=100,player=100,time=60,tm,em;function flash(s){$('msg').textContent=s;setTimeout(()=>{$('msg').textContent=''},400)}function punch(a){if(!running||!model)return;act=a;at=0;enemy=Math.max(0,enemy-(a==='jab'?6:a==='straight'?9:8));$('eh').style.width=enemy+'%';let p=a==='jab'?pl:pr,home=p.position.clone();p.position.z=-2.0;p.position.y=-.05;setTimeout(()=>p.position.copy(home),120);if(enemy<=0)end(true)}function update(dt){if(!model)return;at+=dt;model.position.y=Math.sin(performance.now()*.004)*.014;look.position.y=model.position.y;model.rotation.z=THREE.MathUtils.lerp(model.rotation.z,sway*.13,.2);look.rotation.z=model.rotation.z;sway*=.88;pose(guard?.3:.15);if(act){let p=Math.min(at/.3,1),s=Math.sin(p*Math.PI);if(act==='jab'){rel('la',-.12,-.2,.08,s);rel('lf',-.03,0,0,s);gl.position.z=.02+s*.62}else if(act==='straight'){rel('ra',-.1,.22,-.06,s);rel('rf',-.03,0,0,s);gr.position.z=.02+s*.65}else rel('sp',.22,.18,.05,s);if(p>=1){act='';gl.position.z=gr.position.z=.02}}}function enemyHit(){if(!running)return;$('tell').classList.add('on');setTimeout(()=>{if(!running)return;$('tell').classList.remove('on');if(guard){player-=2;flash('GUARD')}else if(Math.abs(sway)>.08)flash('DODGE');else{player-=10;flash('HIT');cam.position.z=3.38;setTimeout(()=>cam.position.z=3.25,80)}player=Math.max(0,player);$('ph').style.width=player+'%';if(player<=0)end(false)},520)}function start(){enemy=player=100;time=60;running=true;$('eh').style.width=$('ph').style.width='100%';$('time').textContent=60;$('start').style.display='none';$('result').style.display='none';clearInterval(tm);clearInterval(em);flash('FIGHT!');tm=setInterval(()=>{time--;$('time').textContent=Math.max(time,0);if(time<=0)end(enemy<player)},1000);em=setInterval(enemyHit,1900)}function end(w){running=false;clearInterval(tm);clearInterval(em);$('res').textContent=w?'YOU WIN':'YOU LOSE';$('result').style.display='flex'}document.querySelectorAll('[data-a]').forEach(b=>b.onpointerdown=()=>punch(b.dataset.a));$('guard').onpointerdown=()=>guard=true;$('guard').onpointerup=$('guard').onpointercancel=()=>guard=false;$('sway').onpointerdown=()=>sway=sway>0?-1:1;$('fight').onclick=start;$('again').onclick=start;addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});let prev=performance.now();function loop(n){requestAnimationFrame(loop);update(Math.min((n-prev)/1000,.05));prev=n;ren.render(scene,cam)}requestAnimationFrame(loop);</script></body></html>
