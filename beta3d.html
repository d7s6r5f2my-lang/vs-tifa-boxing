nd:#03050ae8}#result{display:none}#loading{z-index:30}.card{text-align:center;width:min(88vw,410px);padding:28px 20px;background:#0b111bea;border:1px solid #fff3;border-radius:18px}.card h1{font-size:48px;margin:0;font-style:italic}.sub{color:#c9a8ff;font-size:11px;font-weight:900;letter-spacing:.12em;margin:7px 0 18px}.primary{padding:15px 48px;border:0;border-radius:10px;background:linear-gradient(#8a55ee,#5a29b9);color:#fff;font-size:22px;font-weight:1000}</style></head><body><div class="hud"><div><div class="name">TIFA</div><div class="bar"><div id="eh" class="fill eh"></div></div></div><div id="time">60</div><div><div class="name r">YOU</div><div class="bar"><div id="ph" class="fill ph"></div></div></div></div><div id="msg" class="msg"></div><div id="tell" class="tell">ATTACK!</div><div class="tag">3D MODEL PASS 2 · LONG HAIR / WHITE TOP / RED GLOVES</div><div class="controls"><button class="atk" data-a="jab"><b>🥊</b>JAB</button><button class="atk" data-a="straight"><b>💥</b>STRAIGHT</button><button class="atk" data-a="body"><b>↘</b>BODY</button><button class="def" id="guard"><b>◆</b>GUARD</button><button class="def" id="sway"><b>↔</b>SWAY</button></div><div id="loading"><div class="card"><h1>3D</h1><div class="sub" id="loadtxt">MODEL LOADING…</div></div></div><div id="start"><div class="card"><h1>VS TIFA</h1><div class="sub">CHARACTER MODEL PASS 2</div><button id="fight" class="primary">FIGHT</button></div></div><div id="result"><div class="card"><h1 id="res">RESULT</h1><div class="sub">3D BETA</div><button id="again" class="primary">REMATCH</button></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x070a11);scene.fog=new THREE.Fog(0x070a11,7,18);const cam=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,40);cam.position.set(0,1.42,4.05);cam.lookAt(0,1.27,0);const ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});ren.setPixelRatio(Math.min(devicePixelRatio,1.5));ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=true;ren.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(ren.domElement);scene.add(new THREE.HemisphereLight(0xdbe5ff,0x161019,2.4));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(-3,6,4);scene.add(key);const rim=new THREE.DirectionalLight(0x789dff,2.8);rim.position.set(4,4,-3);scene.add(rim);const floor=new THREE.Mesh(new THREE.PlaneGeometry(14,14),new THREE.MeshStandardMaterial({color:0x29313c,roughness:.72}));floor.rotation.x=-Math.PI/2;scene.add(floor);for(let i=0;i<3;i++){let m=new THREE.MeshStandardMaterial({color:[0x327dcc,0xf2f2f2,0xc92f43][i]});for(const z of[-1.55,1.55]){let r=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,5.8,10),m);r.rotation.z=Math.PI/2;r.position.set(0,.58+i*.46,z);scene.add(r)}}let model,bones={},base={},act='',at=0,guard=false,sway=0,gear=new THREE.Group();scene.add(gear);const mat=(c,r=.55)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const hair=mat(0x100e14,.5),white=mat(0xf1f1ef,.62),black=mat(0x17191e,.58),red=mat(0x9f1729,.42),skin=mat(0xd79a7d,.68);function mesh(g,m,p,s=[1,1,1]){let x=new THREE.Mesh(g,m);x.position.set(...p);x.scale.set(...s);x.castShadow=true;gear.add(x);return x}function buildLook(){gear.clear();mesh(new THREE.SphereGeometry(.145,20,16),skin,[0,1.72,.02],[.82,1.08,.76]);mesh(new THREE.SphereGeometry(.158,20,14),hair,[0,1.77,.055],[1,1.02,.78]);mesh(new THREE.SphereGeometry(.135,18,12),skin,[0,1.70,.115],[.79,.92,.54]);for(const x of[-.045,.045])mesh(new THREE.SphereGeometry(.009,10,8),mat(0x3b2524),[x,1.725,.235]);mesh(new THREE.BoxGeometry(.045,.009,.012),mat(0x8e3e49),[0,1.655,.237]);for(const x of[-.115,.115]){let h=mesh(new THREE.CapsuleGeometry(.055,.72,6,10),hair,[x,1.34,.09],[.85,1,1]);h.rotation.z=x>0?-.07:.07}mesh(new THREE.CapsuleGeometry(.19,.43,8,16),white,[0,1.31,.02],[1.12,1,.66]);mesh(new THREE.BoxGeometry(.43,.10,.24),black,[0,1.04,.02]);mesh(new THREE.CapsuleGeometry(.14,.38,7,14),black,[0,1.00,.01],[1.35,1,.78]);for(const x of[-.19,.19]){mesh(new THREE.CapsuleGeometry(.075,.46,6,12),skin,[x,1.31,.02],[.88,1,.88]);let g=mesh(new THREE.SphereGeometry(.12,16,12),red,[x,1.51,.20],[1.05,.92,1.18]);g.name=x<0?'gloveL':'gloveR'}for(const x of[-.105,.105]){mesh(new THREE.CapsuleGeometry(.085,.63,7,12),black,[x,.52,.01],[.9,1,.9]);mesh(new THREE.CapsuleGeometry(.095,.27,6,12),black,[x,.12,.03],[1,1,.95])}}const aliases={la:['leftarm','leftupperarm'],ra:['rightarm','rightupperarm'],lf:['leftforearm','leftlowerarm'],rf:['rightforearm','rightlowerarm'],sp:['spine1','spine2','spine']};function find(a){let o=null;model.traverse(n=>{if(o||!n.isBone)return;let s=n.name.toLowerCase().replace(/[^a-z]/g,'');if(a.some(k=>s.includes(k)))o=n});return o}function save(){for(const[k,a]of Object.entries(aliases)){bones[k]=find(a);if(bones[k])base[k]=bones[k].quaternion.clone()}}function rel(k,x,y,z,t=.2){if(!bones[k])return;let q=base[k].clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z)));bones[k].quaternion.slerp(q,t)}function pose(t=.2){rel('la',-.7,0,.75,t);rel('ra',-.7,0,-.75,t);rel('lf',-1.25,0,.12,t);rel('rf',-1.25,0,-.12,t);rel('sp',-.08,0,0,t)}new GLTFLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Michelle.glb',g=>{model=g.scene;scene.add(model);model.scale.setScalar(1.01);model.rotation.y=Math.PI;model.traverse(o=>{if(o.isMesh){o.castShadow=true;if(o.material){o.material=o.material.clone();o.material.color.set(0x24262c);o.material.roughness=.75}}});save();buildLook();pose(.8);$('loading').style.display='none'},undefined,()=>{$('loadtxt').textContent='MODEL LOAD ERROR'});let running=false,enemy=100,player=100,time=60,tm,em;const $=x=>document.getElementById(x);function flash(s){$('msg').textContent=s;setTimeout(()=>{$('msg').textContent=''},450)}function punch(a){if(!running||!model)return;act=a;at=0;enemy=Math.max(0,enemy-(a==='jab'?6:a==='straight'?9:8));$('eh').style.width=enemy+'%';if(enemy<=0)end(true)}function update(dt){if(!model)return;at+=dt;model.position.y=Math.sin(performance.now()*.004)*.015;gear.position.y=model.position.y;model.rotation.z=THREE.MathUtils.lerp(model.rotation.z,sway*.16,.2);gear.rotation.z=model.rotation.z;sway*=.88;if(guard){pose(.25);return}pose(.14);if(!act)return;let p=Math.min(at/.3,1),s=Math.sin(p*Math.PI);if(act==='jab'){rel('la',-.12,-.18,.08,s);rel('lf',-.02,0,0,s);gear.children.find(x=>x.name==='gloveL')?.position.lerp(new THREE.Vector3(-.03,1.55,.62),s)}else if(act==='straight'){rel('ra',-.1,.22,-.06,s);rel('rf',-.02,0,0,s);gear.children.find(x=>x.name==='gloveR')?.position.lerp(new THREE.Vector3(.03,1.55,.66),s)}else rel('sp',.24,.18,.05,s);if(p>=1){act='';buildLook()}}function enemyHit(){if(!running)return;$('tell').classList.add('on');setTimeout(()=>{if(!running)return;$('tell').classList.remove('on');if(guard){player-=2;flash('GUARD')}else if(Math.abs(sway)>.08)flash('DODGE');else{player-=10;flash('HIT')}player=Math.max(0,player);$('ph').style.width=player+'%';if(player<=0)end(false)},520)}function start(){enemy=player=100;time=60;running=true;$('eh').style.width=$('ph').style.width='100%';$('time').textContent=60;$('start').style.display='none';$('result').style.display='none';clearInterval(tm);clearInterval(em);flash('FIGHT!');tm=setInterval(()=>{if(--time<=0)end(enemy<player);$('time').textContent=Math.max(time,0)},1000);em=setInterval(enemyHit,1900)}function end(w){running=false;clearInterval(tm);clearInterval(em);$('res').textContent=w?'YOU WIN':'YOU LOSE';$('result').style.display='flex'}document.querySelectorAll('[data-a]').forEach(b=>b.onpointerdown=()=>punch(b.dataset.a));$('guard').onpointerdown=()=>guard=true;$('guard').onpointerup=$('guard').onpointercancel=()=>guard=false;$('sway').onpointerdown=()=>sway=sway>0?-1:1;$('fight').onclick=start;$('again').onclick=start;addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});let prev=performance.now();function loop(n){requestAnimationFrame(loop);update(Math.min((n-prev)/1000,.05));prev=n;ren.render(scene,cam)}requestAnimationFrame(loop);</script></body></html>
