ize:11px;color:#bfd0df;margin-top:14px;line-height:1.5}@media(max-height:430px){.ctrl{min-height:52px}.hud{top:max(4px,env(safe-area-inset-top))}#warn{top:16%}#msg{top:27%}}</style></head><body><div id="g"><div id="vig"></div><div id="flash"></div><div class="hud"><div><div class="name">TIFA</div><div class="shell"><div class="bar"><div class="fill" id="eh"></div></div></div></div><div><div class="tag">ROUND 1</div><div id="tm">60</div></div><div><div class="name right">YOU</div><div class="shell"><div class="bar"><div class="fill" id="ph"></div></div></div><div class="st"><div id="st"></div></div></div></div><div id="warn">ATTACK</div><div id="msg"></div><div class="controls"><button class="ctrl atk" data-a="jab"><b>🥊</b>JAB</button><button class="ctrl atk" data-a="straight"><b>💥</b>STRAIGHT</button><button class="ctrl atk" data-a="body"><b>↘</b>BODY</button><button class="ctrl def" id="guard"><b>◆</b>GUARD</button><button class="ctrl def" data-a="left"><b>←</b>SWAY</button><button class="ctrl def" data-a="right"><b>→</b>SWAY</button></div><div id="start"><div class="card"><h1>VS TIFA</h1><div class="sub">VISUAL EDITION</div><button id="fight">FIGHT</button><div class="note">iPhone Safari・見た目強化版<br>ライティング／顔／髪／衣装／リング演出を強化</div></div></div><div id="result"><div class="card"><h1 id="res"></h1><button id="again">REMATCH</button></div></div><div id="err"><div class="card">3Dの読み込みに失敗しました。Safariで再読み込みしてください。</div></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script><script>(()=>{'use strict';const $=x=>document.getElementById(x);let sc,cam,ren,tifa,L,R,active=0,busy=0,guard=0,counter=0,eh=100,ph=100,st=100,sec=60,tm,ai,shake=0,idle=0,anim={t:'idle',p:0};const M=(c,r=.55,m=.03,e=0,i=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,emissive:e,emissiveIntensity:i});function mesh(g,ma,p,x=0,y=0,z=0,sx=1,sy=1,sz=1){let o=new THREE.Mesh(g,ma);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=o.receiveShadow=true;(p||sc).add(o);return o}function grp(p,x=0,y=0,z=0){let g=new THREE.Group();g.position.set(x,y,z);(p||sc).add(g);return g}function ring(){let floor=M(0x28384b,.72);mesh(new THREE.PlaneGeometry(8,8),floor,sc,0,0,0).rotation.x=-Math.PI/2;let apron=M(0x090d14,.5,.12);mesh(new THREE.BoxGeometry(6.6,.35,6.6),apron,sc,0,-.18,0);let rope=M(0xe8edf4,.32,.18);[-1.15,-.7,-.25].forEach(y=>{[-2.85,2.85].forEach(x=>mesh(new THREE.CylinderGeometry(.025,.025,5.8,8),rope,sc,x,y+1.45,0).rotation.x=Math.PI/2);[-2.85,2.85].forEach(z=>mesh(new THREE.CylinderGeometry(.025,.025,5.8,8),rope,sc,0,y+1.45,z).rotation.z=Math.PI/2)});let post=M(0x1f2b39,.45,.25);[-2.9,2.9].forEach(x=>[-2.9,2.9].forEach(z=>mesh(new THREE.CylinderGeometry(.065,.085,2.55,12),post,sc,x,1.24,z)));for(let i=0;i<26;i++){let a=i/26*Math.PI*2,r=5.4+Math.random()*.9;let h=M(i%3?0x1b2230:0x2b3443,.9);mesh(new THREE.SphereGeometry(.08+Math.random()*.05,8,6),h,sc,Math.cos(a)*r,.8+Math.random()*1.1,Math.sin(a)*r)}}function face(parent,skin,hair){let h=grp(parent,0,1.08,-.01);mesh(new THREE.SphereGeometry(.23,30,24),skin,h,0,0,0,.88,1.15,.9);mesh(new THREE.SphereGeometry(.17,22,18),skin,h,0,-.08,-.005,.88,.78,.92);mesh(new THREE.ConeGeometry(.032,.09,10),skin,h,0,-.005,-.214,.7,1,.7).rotation.x=Math.PI/2;let eye=M(0x321d1d,.35);[-.078,.078].forEach(x=>{mesh(new THREE.SphereGeometry(.018,12,8),eye,h,x,.025,-.211,1.15,.65,.45);mesh(new THREE.BoxGeometry(.082,.012,.012),hair,h,x,.064,-.205).rotation.z=x<0?.06:-.06});let lip=M(0x8f4050,.45);mesh(new THREE.BoxGeometry(.09,.014,.018),lip,h,0,-.105,-.212);let cap=mesh(new THREE.SphereGeometry(.245,28,20),hair,h,0,.08,.035,.98,.95,1);cap.rotation.x=-.08;for(let i=-3;i<=3;i++){let s=mesh(new THREE.CapsuleGeometry(.032,.27,5,8),hair,h,i*.045,.025,-.17);s.rotation.z=i*.035;s.rotation.x=-.16}let pony=grp(h,0,.08,.17);for(let i=0;i<5;i++){let seg=mesh(new THREE.CapsuleGeometry(.055,.34,5,8),hair,pony,(i-2)*.025,-.16-i*.24,.03);seg.rotation.z=(i-2)*.04}return h}function arm(parent,s,s 'idle',p:0}}function punch(a){if(!active||busy)return;let cost=a==='jab'?9:a==='straight'?17:14;if(st<cost)return say('STAMINA');st-=cost;let dmg=a==='jab'?4:a==='straight'?8:6;eh=Math.max(0,eh-dmg*(counter?1.8:1));setAnim(a==='jab'?'hit':'hitL');counter=0;shake=a==='straight'?.11:.065;fl(false);say('HIT!');hud();end()}function sway(d){if(!active)return;setAnim(d);if(busy){busy=0;counter=1;say('DODGE!');setTimeout(()=>counter=0,900)}}function enemy(){if(!active||busy)return;busy=1;let a=Math.random()<.34?'JAB':Math.random()<.5?'STRAIGHT':'BODY';$('warn').textContent=a;$('warn').classList.add('on');setTimeout(()=>$('warn').classList.remove('on'),620);setTimeout(()=>{if(!active||!busy)return;setAnim(a==='JAB'?'jab':a==='STRAIGHT'?'straight':'body');setTimeout(()=>{if(!active||!busy)return;if(guard){busy=0;counter=1;say('BLOCK!');setTimeout(()=>counter=0,900)}else{ph=Math.max(0,ph-(a==='STRAIGHT'?11:a==='BODY'?9:7));busy=0;shake=a==='STRAIGHT'?.28:.19;fl(true);say('HIT!');hud();end()}},190)},430)}function end(){if(eh<=0)finish('YOU WIN');else if(ph<=0)finish('TIFA WINS')}function finish(x){active=0;clearInterval(tm);clearInterval(ai);$('res').textContent=x;setTimeout(()=>$('result').style.display='flex',250)}function start(){if(active)return;active=1;$('start').style.display='none';tm=setInterval(()=>{sec--;st=Math.min(100,st+7);hud();if(sec<=0)finish(eh<ph?'YOU WIN':eh>ph?'TIFA WINS':'DRAW')},1000);ai=setInterval(enemy,1650)}function loop(){requestAnimationFrame(loop);animate();if(shake>0){cam.position.x=(Math.random()-.5)*shake;cam.position.y=1.62+(Math.random()-.5)*shake*.5;shake*=.84}else{cam.position.x*=.8;cam.position.y+=(1.62-cam.position.y)*.15}cam.lookAt(0,1.32,0);ren.render(sc,cam)}$('fight').onpointerup=e=>{e.preventDefault();start()};$('again').onclick=()=>location.reload();document.querySelectorAll('[data-a]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();let a=b.dataset.a;a==='left'||a==='right'?sway(a):punch(a)});$('guard').onpointerdown=e=>{e.preven
