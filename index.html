<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>VS TIFA — 3D Boxing</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}#game{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 35%,#242a36 0,#11151c 35%,#06080c 72%)}canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}.ring{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 68%,rgba(15,23,35,.15) 69%,rgba(15,23,35,.72) 100%)}.rope{position:absolute;left:-5%;right:-5%;height:3px;background:linear-gradient(90deg,#6d1017,#ff4252,#6d1017);box-shadow:0 0 8px #ff334477}.rope.r1{top:50%}.rope.r2{top:61%;background:linear-gradient(90deg,#12365f,#39a7ff,#12365f)}.rope.r3{top:72%}.hud{position:absolute;z-index:8;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:grid;grid-template-columns:1fr 64px 1fr;gap:7px;text-shadow:0 2px 7px #000}.name{font-size:10px;font-weight:900;letter-spacing:.14em}.r{text-align:right}.bar{height:14px;background:#0c1018d9;border:1px solid #ffffff4d;overflow:hidden}.fill{height:100%;transition:.15s}.enemyhp{background:linear-gradient(90deg,#55d96f,#b3ff82)}.playerhp{background:linear-gradient(90deg,#ff334d,#ff8a63)}#time{text-align:center;font-size:28px;font-weight:1000;font-style:italic}.round{text-align:center;font-size:7px;letter-spacing:.14em}.msg{position:absolute;z-index:10;left:50%;top:21%;transform:translateX(-50%);font-size:clamp(25px,8vw,52px);font-weight:1000;font-style:italic;text-shadow:0 0 18px #7e4cff,0 3px 9px #000;white-space:nowrap}.status{position:absolute;z-index:8;left:10px;bottom:92px;font-size:10px;color:#d9e4ef;background:#070b12b5;padding:6px 9px;border:1px solid #ffffff24;border-radius:8px}.combo{position:absolute;z-index:8;right:13px;bottom:92px;text-align:right;font-style:italic;text-shadow:0 0 15px #8154ff,0 3px 7px #000}.combo b{font-size:42px}.combo span{font-size:15px;font-weight:900}.controls{position:absolute;z-index:12;left:7px;right:7px;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.controls button{min-height:58px;border:1px solid #ffffff45;border-radius:12px;background:linear-gradient(#171e2be8,#080b12f2);color:#fff;font-size:9px;font-weight:900;backdrop-filter:blur(9px)}.controls button b{display:block;font-size:19px}.controls button:active{transform:scale(.97);filter:brightness(1.35)}.atk{border-bottom:3px solid #ff5164!important}.def{border-bottom:3px solid #59c7ff!important}#start,#result{position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:#03050acc;backdrop-filter:blur(5px)}#result{display:none}.card{text-align:center;width:min(86vw,420px);padding:28px 24px;background:#0a0f18eb;border:1px solid #ffffff35;border-radius:18px}.card h1{margin:0;font-size:clamp(42px,13vw,72px);font-style:italic;line-height:.92}.sub{margin:10px 0 22px;letter-spacing:.18em;color:#b991ff;font-weight:900}.primary{padding:14px 42px;border:0;border-radius:9px;background:linear-gradient(#8a4dff,#5320b8);color:#fff;font-size:22px;font-weight:1000}.tip{font-size:11px;line-height:1.5;color:#cbd5e1;margin-top:12px}#loading{margin-top:12px;font-size:11px;color:#9fd4ff}</style></head><body><div id="game"><div class="rope r1"></div><div class="rope r2"></div><div class="rope r3"></div><div class="ring"></div><div class="hud"><div><div class="name">TIFA LOCKHART</div><div class="bar"><div id="eh" class="fill enemyhp"></div></div></div><div><div class="round">ROUND 1</div><div id="time">60</div></div><div><div class="name r">YOU</div><div class="bar"><div id="ph" class="fill playerhp"></div></div></div></div><div id="msg" class="msg"></div><div id="status" class="status">3D MODEL LOADING...</div><div class="combo"><b id="comboN">0</b> <span>HIT<br>COMBO</span></div><div class="controls"><button class="atk" data-a="jab"><b>🥊</b>JAB</button><button class="atk" data-a="straight"><b>💥</b>STRAIGHT</button><button class="atk" data-a="body"><b>↘</b>BODY</button><button class="def" id="guard"><b>◆</b>GUARD</button><button class="def" id="sway"><b>↔</b>SWAY</button></div><div id="start"><div class="card"><h1>VS TIFA</h1><div class="sub">3D BOXING EDITION</div><button id="fight" class="primary" disabled>FIGHT</button><div id="loading">3Dモデルを読み込み中...</div><div class="tip">元ゲームの「一人称・タップ攻撃・長押しガード・スウェイ」感に寄せた軽量3D版</div></div></div><div id="result"><div class="card"><h1 id="res"></h1><button id="again" class="primary">REMATCH</button></div></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import{GLTFLoader}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';const $=id=>document.getElementById(id),game=$('game');const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x07090f,5.5,13);const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,50);camera.position.set(0,1.5,5.1);camera.lookAt(0,1.25,0);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;game.insertBefore(renderer.domElement,game.firstChild);scene.add(new THREE.HemisphereLight(0xbcd5ff,0x25180d,2.3));const key=new THREE.DirectionalLight(0xffffff,4.4);key.position.set(-2.5,5,4);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x89b8ff,3.0);rim.position.set(3,3,-2);scene.add(rim);const red=new THREE.PointLight(0xff3344,22,8);red.position.set(-3,1.6,1.5);scene.add(red);const floor=new THREE.Mesh(new THREE.CircleGeometry(5,48),new THREE.MeshStandardMaterial({color:0x171b22,roughness:.72,metalness:.15}));floor.rotation.x=-Math.PI/2;floor.position.y=-.03;floor.receiveShadow=true;scene.add(floor);const ringLines=new THREE.GridHelper(8,12,0x3d536c,0x1d2530);ringLines.position.y=.005;scene.add(ringLines);let model=null,mixer=null,bones={},basePose=new Map(),actionTween=null,clock=new THREE.Clock(),modelReady=false;function norm(n){return n.toLowerCase().replace(/[^a-z0-9]/g,'')}function findBone(keys){let out=null;if(!model)return null;model.traverse(o=>{if(out||!o.isBone)return;const n=norm(o.name);if(keys.some(k=>n.includes(k)))out=o});return out}function capture(){Object.values(bones).forEach(b=>{if(b)basePose.set(b,{x:b.rotation.x,y:b.rotation.y,z:b.rotation.z})})}function restorePose(a=.18){if(!model)return;const start=[];basePose.forEach((v,b)=>start.push({b,s:{x:b.rotation.x,y:b.rotation.y,z:b.rotation.z},t:v}));const st=performance.now();function f(now){const p=Math.min(1,(now-st)/(a*1000)),e=1-Math.pow(1-p,3);start.forEach(o=>{o.b.rotation.x=o.s.x+(o.t.x-o.s.x)*e;o.b.rotation.y=o.s.y+(o.t.y-o.s.y)*e;o.b.rotation.z=o.s.z+(o.t.z-o.s.z)*e});if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)}function pose(type){if(!model)return;const L=bones.lArm,R=bones.rArm,Lf=bones.lFore,Rf=bones.rFore,sp=bones.spine,head=bones.head;const set=(b,x=0,y=0,z=0)=>{if(!b)return;const q=basePose.get(b)||{x:b.rotation.x,y:b.rotation.y,z:b.rotation.z};b.rotation.set(q.x+x,q.y+y,q.z+z)};restorePose(.05);set(L,-.55,.15,-.25);set(R,-.55,-.15,.25);set(Lf,-1.15,0,.05);set(Rf,-1.15,0,-.05);if(type==='jab'){set(L,-1.2,.12,-.05);set(Lf,-.12,0,0);if(sp)set(sp,sp.rotation.x,sp.rotation.y+.1,sp.rotation.z-.04)}if(type==='straight'){set(R,-1.25,-.18,.04);set(Rf,-.08,0,0);if(sp)set(sp,0,-.22,.05)}if(type==='body'){set(R,-1.1,-.1,.1);set(Rf,-.18,0,0);if(sp)set(sp,.28,-.12,.1)}if(type==='guard'){set(L,-.9,.08,-.55);set(R,-.9,-.08,.55);set(Lf,-1.45,0,.2);set(Rf,-1.45,0,-.2)}if(type==='hit'){if(sp)set(sp,.08,.18,.18);if(head)set(head,.05,-.2,.15)}}function motion(type,ms=260){if(!model)return;cancelAnimationFrame(actionTween);pose(type);const st=performance.now(),startZ=model.position.z,startX=model.position.x,startRy=model.rotation.y;function step(now){const p=Math.min(1,(now-st)/ms),s=Math.sin(p*Math.PI);if(type==='jab'||type==='straight')model.position.z=startZ+.18*s;if(type==='body')model.position.y=-.04-.12*s;if(type==='swayL')model.position.x=startX-.42*s;if(type==='swayR')model.position.x=startX+.42*s;if(type==='hit'){model.position.x=startX+.22*s;model.rotation.y=startRy+.14*s}if(type==='enemy'){model.position.z=startZ+.34*s}if(p<1)actionTween=requestAnimationFrame(step);else{model.position.set(0,0,0);model.rotation.y=startRy;restorePose(.16)}}actionTween=requestAnimationFrame(step)}const loader=new GLTFLoader();loader.load('https://three.ws/avatars/realistic-female.glb',g=>{model=g.scene;const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());const scale=2.95/Math.max(size.y,.01);model.scale.setScalar(scale);model.position.x=-center.x*scale;model.position.y=-box.min.y*scale;model.position.z=0;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.roughness=Math.min(.78,o.material.roughness??.65);o.material.metalness=Math.min(.18,o.material.metalness??0)}}});scene.add(model);bones={lArm:findBone(['leftarm','upperarm_l','mixamorigleftarm']),rArm:findBone(['rightarm','upperarm_r','mixamorigrightarm']),lFore:findBone(['leftforearm','lowerarm_l','mixamorigleftforearm']),rFore:findBone(['rightforearm','lowerarm_r','mixamorigrightforearm']),spine:findBone(['spine2','spine1','spine']),head:findBone(['head'])};capture();pose('guard');setTimeout(()=>restorePose(.2),300);if(g.animations&&g.animations.length){mixer=new THREE.AnimationMixer(model);let clip=g.animations.find(a=>/idle|breath|box/i.test(a.name))||g.animations[0];mixer.clipAction(clip).play()}modelReady=true;$('fight').disabled=false;$('loading').textContent='3Dモデル準備完了';$('status').textContent='REAL-TIME 3D';},undefined,e=>{$('loading').textContent='3Dモデルの読み込みに失敗しました';$('status').textContent='MODEL LOAD ERROR';console.error(e)});let eh=100,ph=100,t=60,on=false,guard=false,dodgeUntil=0,busy=false,combo=0,comboTimer,timer,ai;function ui(){$('eh').style.width=eh+'%';$('ph').style.width=ph+'%';$('time').textContent=t;$('comboN').textContent=combo}function say(s,ms=420){$('msg').textContent=s;setTimeout(()=>{if($('msg').textContent===s)$('msg').textContent=''},ms)}function end(r){if(!on)return;on=false;clearInterval(timer);clearInterval(ai);clearTimeout(comboTimer);$('res').textContent=r;$('result').style.display='flex'}function playerHit(d,label,type){if(!on||busy)return;busy=true;eh=Math.max(0,eh-d);combo++;clearTimeout(comboTimer);comboTimer=setTimeout(()=>{combo=0;ui()},1100);motion(type,type==='jab'?190:250);say(label);ui();if(navigator.vibrate)navigator.vibrate(12);setTimeout(()=>busy=false,170);if(eh<=0)end('YOU WIN')}function sway(){if(!on)return;dodgeUntil=Date.now()+520;motion(Math.random()>.5?'swayL':'swayR',320);say('SWAY')}function enemy(){if(!on)return;say('ATTACK!',500);motion('enemy',260);setTimeout(()=>{if(!on)return;if(Date.now()<dodgeUntil){say('DODGE!');combo++;ui();return}const d=guard?3:10+Math.floor(Math.random()*5);ph=Math.max(0,ph-d);combo=0;motion('hit',230);say(guard?'BLOCK':'HIT!');ui();if(navigator.vibrate)navigator.vibrate(guard?18:40);if(ph<=0)end('TIFA WINS')},500)}function start(){if(!modelReady)return;eh=ph=100;t=60;combo=0;on=true;guard=false;dodgeUntil=0;ui();$('start').style.display='none';$('result').style.display='none';clearInterval(timer);clearInterval(ai);timer=setInterval(()=>{t--;ui();if(t<=0)end(eh<ph?'YOU WIN':eh>ph?'TIFA WINS':'DRAW')},1000);ai=setInterval(enemy,1900);say('FIGHT!',700)}document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('pointerdown',()=>{const a=b.dataset.a;if(a==='jab')playerHit(5,'JAB!','jab');if(a==='straight')playerHit(9,'STRAIGHT!','straight');if(a==='body')playerHit(7,'BODY!','body')}));$('guard').addEventListener('pointerdown',()=>{if(!on)return;guard=true;pose('guard');say('GUARD')});['pointerup','pointercancel','pointerleave'].forEach(e=>$('guard').addEventListener(e,()=>{guard=false;restorePose(.16)}));$('sway').addEventListener('pointerdown',sway);$('fight').addEventListener('click',start);$('again').addEventListener('click',start);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.65))});ui();function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();if(mixer)mixer.update(dt*.35);if(model&&on&&!busy&&!guard){model.rotation.z=Math.sin(performance.now()/430)*.015;model.position.y=Math.sin(performance.now()/360)*.018}else if(model&&!on){model.rotation.z=0}renderer.render(scene,camera)}animate();</script></body></html>
