<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>VS TIFA 3D BOXING</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;color:#fff;font-family:-apple-system,sans-serif;touch-action:none}#g{position:fixed;inset:0}canvas{position:absolute;inset:0;width:100%;height:100%}#hud{position:absolute;z-index:5;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:grid;grid-template-columns:1fr 65px 1fr;gap:8px}.n{font-size:11px;font-weight:900}.r{text-align:right}.bar{height:15px;background:#222;border:2px solid #ddd;overflow:hidden}.fill{height:100%;width:100%;transition:.2s}#eh{background:#ed2748}#ph{background:#27a9ed}#time{text-align:center;font-size:30px;font-weight:1000}.st{height:5px;background:#222;margin-top:3px}.st div{height:100%;background:#ffd642;width:100%}#warn{position:absolute;z-index:6;top:21%;left:50%;transform:translateX(-50%);font-size:40px;font-weight:1000;text-shadow:0 0 15px red;opacity:0}#msg{position:absolute;z-index:6;top:31%;left:50%;transform:translateX(-50%);font-size:28px;font-weight:1000;text-shadow:0 3px 8px #000}#ctrl{position:absolute;z-index:10;bottom:max(7px,env(safe-area-inset-bottom));left:7px;right:7px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}button{min-height:62px;border:1px solid #ffffff44;border-radius:10px;background:#111d30e8;color:#fff;font-weight:900;font-size:11px}button:active{filter:brightness(1.5)}.atk{border-bottom:3px solid #ff3b59}.def{border-bottom:3px solid #36bde8}#start,#result,#err{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#152744,#03060c 70%)}#result,#err{display:none}.card{text-align:center;padding:25px;width:min(88vw,480px)}h1{font-size:clamp(46px,12vw,78px);margin:0;font-style:italic}.sub{color:#ff3b59;font-weight:900;letter-spacing:.2em;margin:7px 0 22px}#fight,#again{font-size:25px;padding:14px 45px;background:#d51d39}.note{font-size:11px;color:#bdd0e2;margin-top:14px}@media(max-height:430px){button{min-height:52px}#warn{top:17%}}</style></head><body><div id="g"><div id="hud"><div><div class="n">TIFA</div><div class="bar"><div class="fill" id="eh"></div></div></div><div id="time">60</div><div><div class="n r">YOU</div><div class="bar"><div class="fill" id="ph"></div></div><div class="st"><div id="st"></div></div></div></div><div id="warn">ATTACK!</div><div id="msg"></div><div id="ctrl"><button class="atk" data-a="jab">🥊<br>JAB</button><button class="atk" data-a="straight">💥<br>STRAIGHT</button><button class="atk" data-a="body">↘<br>BODY</button><button class="def" id="guard">◆<br>GUARD</button><button class="def" data-a="left">←<br>SWAY</button><button class="def" data-a="right">→<br>SWAY</button></div><div id="start"><div class="card"><h1>VS TIFA</h1><div class="sub">3D BOXING</div><button id="fight">FIGHT</button><div class="note">iPhone Safari テスト版</div></div></div><div id="result"><div class="card"><h1 id="res"></h1><button id="again">REMATCH</button></div></div><div id="err"><div class="card">3Dの読み込みに失敗しました。Safariで再読み込みしてください。</div></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script><script>(()=>{'use strict';const $=x=>document.getElementById(x);let sc,cam,ren,tifa,L,R,active=0,busy=0,guard=0,counter=0,eh=100,ph=100,st=100,sec=60,tm,ai,shake=0;function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.55})}function m(g,ma,p,x,y,z){let o=new THREE.Mesh(g,ma);o.position.set(x,y,z);(p||sc).add(o);return o}function build(){tifa=new THREE.Group();sc.add(tifa);let skin=mat(0xe4ad98),white=mat(0xeeeae5),black=mat(0x15151a),red=mat(0xb20e29);m(new THREE.CylinderGeometry(.28,.34,.65,20),white,tifa,0,1.35,0);m(new THREE.SphereGeometry(.27,24,18),skin,tifa,0,1.92,0);let hair=m(new THREE.SphereGeometry(.29,22,16),black,tifa,0,2,.08);hair.scale.set(1,1.15,1);[-.14,.14].forEach(x=>{let h=m(new THREE.CapsuleGeometry(.09,.9,6,12),black,tifa,x,1.5,.12);h.rotation.z=x>0?-.08:.08});m(new THREE.CylinderGeometry(.34,.38,.3,18),black,tifa,0,.92,0);[-.18,.18].forEach(x=>m(new THREE.CapsuleGeometry(.11,.55,6,12),skin,tifa,x,.5,0));function arm(s){let g=new THREE.Group();g.position.set(.38*s,1.6,0);tifa.add(g);let a=m(new THREE.CapsuleGeometry(.085,.5,6,12),skin,g,0,-.25,0);a.rotation.z=.45*s;let gl=m(new THREE.SphereGeometry(.18,18,14),red,g,.20*s,-.52,-.12);return g}L=arm(-1);R=arm(1)}function init(){if(!window.THREE){$('err').style.display='flex';return}sc=new THREE.Scene();sc.background=new THREE.Color(0x050914);cam=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,30);cam.position.set(0,1.55,4.2);cam.lookAt(0,1.3,0);ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,1.5));ren.setSize(innerWidth,innerHeight);$('g').prepend(ren.domElement);sc.add(new THREE.HemisphereLight(0xbad8ff,0x111111,1.4));let d=new THREE.DirectionalLight(0xffeee5,2);d.position.set(-2,4,3);sc.add(d);m(new THREE.PlaneGeometry(8,8),mat(0x24364c),sc,0,0,0).rotation.x=-Math.PI/2;build();loop()}function hud(){$('eh').style.width=eh+'%';$('ph').style.width=ph+'%';$('st').style.width=st+'%';$('time').textContent=sec}function say(x){$('msg').textContent=x;clearTimeout(say.t);say.t=setTimeout(()=>$('msg').textContent='',500)}function punch(a){if(!active||busy)return;let cost=a==='jab'?9:a==='straight'?17:14;if(st<cost)return say('STAMINA');st-=cost;let dmg=a==='jab'?4:a==='straight'?8:6;eh=Math.max(0,eh-dmg*(counter?1.8:1));counter=0;let arm=a==='jab'?L:R,base=arm.rotation.x;arm.rotation.x=-1.1;setTimeout(()=>arm.rotation.x=base,160);shake=.08;say('HIT!');hud();end()}function sway(dir){if(!active)return;tifa.position.x=dir==='left'?-0.45:.45;setTimeout(()=>tifa.position.x=0,260);if(busy){busy=0;counter=1;say('DODGE!')}}function enemy(){if(!active||busy)return;busy=1;$('warn').style.opacity=1;setTimeout(()=>{$('warn').style.opacity=0;if(!active||!busy)return;if(guard){busy=0;counter=1;say('BLOCK!')}else{ph=Math.max(0,ph-8-Math.random()*5);busy=0;shake=.22;say('HIT!');hud();end()}},650)}function end(){if(eh<=0)finish('YOU WIN');else if(ph<=0)finish('TIFA WINS')}function finish(x){active=0;clearInterval(tm);clearInterval(ai);$('res').textContent=x;$('result').style.display='flex'}function start(){if(active)return;active=1;$('start').style.display='none';tm=setInterval(()=>{sec--;st=Math.min(100,st+8);hud();if(sec<=0)finish(eh<ph?'YOU WIN':eh>ph?'TIFA WINS':'DRAW')},1000);ai=setInterval(enemy,1800)}function loop(){requestAnimationFrame(loop);if(tifa){tifa.position.y=Math.sin(performance.now()/400)*.015;if(shake>0){cam.position.x=(Math.random()-.5)*shake;shake*=.85}else cam.position.x*=.8;cam.lookAt(0,1.3,0)}ren.render(sc,cam)}$('fight').onclick=start;$('again').onclick=()=>location.reload();document.querySelectorAll('[data-a]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();let a=b.dataset.a;a==='left'||a==='right'?sway(a):punch(a)});$('guard').onpointerdown=e=>{e.preventDefault();guard=1};['pointerup','pointercancel','pointerleave'].forEach(x=>$('guard').addEventListener(x,()=>guard=0));addEventListener('resize',()=>{if(!ren)return;cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});try{init()}catch(e){$('err').style.display='flex'}})();</script></body></html>
