x;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.controls button{min-height:60px;border:1px solid #ffffff45;border-radius:12px;background:linear-gradient(#18202cec,#090d15f2);color:#fff;font-size:9px;font-weight:900;touch-action:manipulation;box-shadow:0 4px 10px #0007}.controls b{display:block;font-size:20px}.atk{border-bottom:3px solid #ff5064!important}.def{border-bottom:3px solid #58c8ff!important}#start,#result{position:absolute;z-index:40;inset:0;display:flex;align-items:center;justify-content:center;background:#040711d9;backdrop-filter:blur(4px)}#result{display:none}.card{text-align:center;width:min(86vw,400px);padding:30px 22px;background:#0b101af0;border:1px solid #ffffff38;border-radius:18px}.card h1{margin:0;font-size:58px;font-style:italic;line-height:.95}.sub{margin:8px 0 22px;color:#c19aff;font-weight:900;letter-spacing:.15em}.primary{padding:16px 48px;border:0;border-radius:10px;background:linear-gradient(#8750f0,#5926b9);color:#fff;font-size:23px;font-weight:1000;touch-action:manipulation}.combo{position:absolute;z-index:26;right:12px;bottom:92px;text-align:right;font-style:italic}.combo b{font-size:40px}.status{position:absolute;z-index:26;left:10px;bottom:92px;font-size:10px;background:#080c14c9;padding:6px 9px;border-radius:8px}.guarding .arm.l{transform:rotate(69deg) translateY(-15px)}.guarding .arm.r{transform:rotate(-69deg) translateY(-15px)}.jab .arm.l{animation:jab .22s cubic-bezier(.2,.8,.2,1)}.straight .arm.r{animation:straight .28s cubic-bezier(.2,.8,.2,1)}.bodyhit{animation:body .30s}.sway{animation:sway .35s}.hurt{animation:hurt .30s}.enemyatk{animation:enemy .32s}.enemyatk .arm.r{animation:enemyarm .32s}@keyframes idle{0%,100%{transform:translate(-50%,-50%) rotateX(1deg) translateY(0)}50%{transform:translate(-50%,-50%) rotateX(1deg) translateY(-4px)}}@keyframes jab{0%,100%{transform:rotate(23deg)}46%{transform:translate(18px,-64px) rotate(87deg) scaleY(1.25)}}@keyframes straight{0%,100%{transform:rotate(-23deg)}46%{transform:translate(-23px,-69px) rotate(-90deg) scaleY(1.30)}}@keyframes body{50%{transform:translate(-50%,-46%) rotate(-7deg) scale(1.04)}}@keyframes sway{50%{transform:translate(-75%,-50%) rotate(-9deg)}}@keyframes hurt{38%{transform:translate(-39%,-52%) rotate(10deg) scale(.98)}}@keyframes enemy{45%{transform:translate(-50%,-50%) scale(1.14)}}@keyframes enemyarm{45%{transform:translate(-28px,-70px) rotate(-92deg) scaleY(1.32)}}@keyframes impact{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(5);opacity:0}}@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,-1px)}}.shake{animation:shake .15s}</style></head><body><div id="game"><div class="spot"></div><div class="crowd"></div><div class="post pl"></div><div class="post pr"></div><div class="ringline r1"></div><div class="ringline r2"></div><div class="ringline r3"></div><div class="ringfloor"></div><div id="fighter" class="fighter"><div class="hairback"></div><div class="ponytail"></div><div class="ear el"></div><div class="ear er"></div><div class="neck"></div><div class="head"></div><div class="brow bl"></div><div class="brow br"></div><div class="eye eyel"></div><div class="eye eyer"></div><div class="nose"></div><div class="mouth"></div><div class="bang"></div><div class="bang b2"></div><div class="bang b3"></div><div class="torso"></div><div class="chestshade"></div><div class="strap sl"></div><div class="strap sr"></div><div class="belt"></div><div class="shorts"></div><div class="arm l"><div class="upper"></div><div class="fore"></div><div class="glove"></div></div><div class="arm r"><div class="upper"></div><div class="fore"></div><div class="glove"></div></div><div class="leg l"></div><div class="leg r"></div><div class="boot l"></div><div class="boot r"></div></div><div class="playerglove pgl"></div><div class="playerglove pgr"></div><div id="impact" class="impact"></div><div class="hud"><div><div class="name">TIFA LOCKHART</div><div class="bar"><div id="eh" class="fill eh"></div></div></div><div><div class="round">ROUND 1</div><div id="time">60</div></div><div><div class="name right">YOU</div><div class="bar"><div id="ph" class="fill ph"></div></div></div></div><div id="msg" class="msg"></div><div class="status">SAFARI STABLE / MODEL V2</div><div class="combo"><b id="combo">0</b> HIT</div><div class="controls"><button class="atk" data-a="jab"><b>🥊</b>JAB</button><button class="atk" data-a="straight"><b>💥</b>STRAIGHT</button><button class="atk" data-a="body"><b>↘</b>BODY</button><button class="def" id="guard"><b>◆</b>GUARD</button><button class="def" id="sway"><b>↔</b>SWAY</button></div><div id="start"><div class="card"><h1>VS TIFA</h1><div class="sub">FIGHT NIGHT</div><button id="fight" class="primary" type="button">FIGHT</button></div></div><div id="result"><div class="card"><h1 id="res">RESULT</h1><button id="again" class="primary" type="button">REMATCH</button></div></div></div><script>var eh=100,ph=100,sec=60,playing=false,guard=false,dodgeUntil=0,busy=false,combo=0,timer=null,ai=null;function el(id){return document.getElementById(id)}function ui(){el('eh').style.width=eh+'%';el('ph').style.width=ph+'%';el('time').textContent=sec;el('combo').textContent=combo}function say(s){el('msg').textContent=s;setTimeout(function(){if(el('msg').textContent===s)el('msg').textContent=''},500)}function anim(c){var f=el('fighter');f.className='fighter';void f.offsetWidth;f.className='fighter '+c;setTimeout(function(){if(!guard)f.className='fighter'},390)}function impact(){var i=el('impact');i.className='impact';void i.offsetWidth;i.className='impact show';var g=el('game');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');setTimeout(function(){g.classList.remove('shake')},170)}function end(r){if(!playing)return;playing=false;clearInterval(timer);clearInterval(ai);el('res').textContent=r;el('result').style.display='flex'}function start(){eh=100;ph=100;sec=60;combo=0;playing=true;guard=false;el('fighter').className='fighter';el('start').style.display='none';el('result').style.display='none';ui();clearInterval(timer);clearInterval(ai);timer=setInterval(function(){if(!playing)return;sec--;ui();if(sec<=0)end(eh<ph?'YOU WIN':eh>ph?'TIFA WINS':'DRAW')},1000);ai=setInterval(enemy,1800);say('FIGHT!')}function attack(type,dmg,label){if(!playing||busy)return;busy=true;eh=Math.max(0,eh-dmg);combo++;anim(type==='body'?'bodyhit':type);impact();say(label);ui();if(navigator.vibrate)navigator.vibrate(10);setTimeout(function(){busy=false},170);if(eh<=0)end('YOU WIN')}function enemy(){if(!playing)return;say('ATTACK!');anim('enemyatk');setTimeout(function(){if(!playing)return;if(Date.now()<dodgeUntil){say('DODGE!');return}ph=Math.max(0,ph-(guard?3:11));combo=0;anim('hurt');impact();say(guard?'BLOCK':'HIT!');ui();if(navigator.vibrate)navigator.vibrate(guard?18:35);if(ph<=0)end('TIFA WINS')},500)}el('fight').onclick=start;el('fight').ontouchend=function(e){e.preventDefault();start()};el('again').onclick=start;var bs=document.querySelectorAll('[data-a]');for(var i=0;i<bs.length;i++){bs[i].onclick=function(){var a=this.getAttribute('data-a');if(a==='jab')attack('jab',5,'JAB!');else if(a==='straight')attack('straight',9,'STRAIGHT!');else attack('body',7,'BODY!')}}el('sway').onclick=function(){if(!playing)return;dodgeUntil=Date.now()+600;anim('sway');say('SWAY')};el('guard').ontouchstart=function(e){e.preventDefault();guard=true;el('fighter').className='fighter guarding';say('GUARD')};el('guard').ontouchend=function(e){e.preventDefault();guard=false;el('fighter').className='fighter'};el('guard').onmousedown=function(){guard=true;el('fighter').className='fighter guarding';say('GUARD')};el('guard').onmouseup=function(){guard=false;el('fighter').className='fighter'};ui();</script></body></html>
