msg" class="msg"></div><div class="status">MODEL REFINEMENT 2</div><div class="combo"><b id="combo">0</b> HIT</div><div class="controls"><button class="atk" data-a="jab"><b>🥊</b>JAB</button><button class="atk" data-a="straight"><b>💥</b>STRAIGHT</button><button class="atk" data-a="body"><b>↘</b>BODY</button><button class="def" id="guard"><b>◆</b>GUARD</button><button class="def" id="sway"><b>↔</b>SWAY</button></div><div id="start"><div class="card"><h1>VS TIFA</h1><div class="sub">MODEL REFINEMENT 2</div><button id="fight" class="primary" type="button">FIGHT</button></div></div><div id="result"><div class="card"><h1 id="res">RESULT</h1><button id="again" class="primary" type="button">REMATCH</button></div></div></div><script>var eh=100,ph=100,sec=60,playing=false,guard=false,dodgeUntil=0,busy=false,combo=0,timer=null,ai=null;function el(x){return document.getElementById(x)}function ui(){el('eh').style.width=eh+'%';el('ph').style.width=ph+'%';el('time').textContent=sec;el('combo').textContent=combo}function say(s){el('msg').textContent=s;setTimeout(function(){if(el('msg').textContent===s)el('msg').textContent=''},500)}function anim(c){var f=el('fighter');f.className='fighter';void f.offsetWidth;f.className='fighter '+c;setTimeout(function(){if(!guard)f.className='fighter'},390)}function flash(){var i=el('impact');i.className='impact';void i.offsetWidth;i.className='impact show'}function end(r){if(!playing)return;playing=false;clearInterval(timer);clearInterval(ai);el('res').textContent=r;el('result').style.display='flex'}function start(){eh=100;ph=100;sec=60;combo=0;playing=true;guard=false;el('start').style.display='none';el('result').style.display='none';ui();clearInterval(timer);clearInterval(ai);timer=setInterval(function(){if(!playing)return;sec--;ui();if(sec<=0)end(eh<ph?'YOU WIN':eh>ph?'TIFA WINS':'DRAW')},1000);ai=setInterval(enemy,1900);say('FIGHT!')}function attack(type,dmg,label){if(!playing||busy)return;busy=true;eh=Math.max(0,eh-dmg);combo++;anim(type==='body'?'bodyhit':type);flash();say(label);ui();setTimeout(function(){busy=false},180);if(eh<=0)end('YOU WIN')}function enemy(){if(!playing)return;say('ATTACK!');anim('enemyatk');setTimeout(function(){if(!playing)return;if(Date.now()<dodgeUntil){say('DODGE!');return}ph=Math.max(0,ph-(guard?3:11));combo=0;anim('hurt');say(guard?'BLOCK':'HIT!');ui();if(ph<=0)end('TIFA WINS')},520)}el('fight').onclick=start;el('fight').ontouchend=function(e){e.preventDefault();start()};el('again').onclick=start;var bs=document.querySelectorAll('[data-a]');for(var i=0;i<bs.length;i++){bs[i].onclick=function(){var a=this.getAttribute('data-a');if(a==='jab')attack('jab',5,'JAB!');else if(a==='straight')attack('straight',9,'STRAIGHT!');else attack('body',7,'BODY!')}}el('sway').onclick=function(){if(!playing)return;dodgeUntil=Date.now()+600;anim('sway');say('SWAY')};el('guard').ontouchstart=function(e){e.preventDefault();guard=true;el('fighter').className='fighter guarding';say('GUARD')};el('guard').ontouchend=function(e){e.preventDefault();guard=false;el('fighter').className='fighter'};el('guard').onmousedown=function(){guard=true;el('fighter').className='fighter guarding';say('GUARD')};el('guard').onmouseup=function(){guard=false;el('fighter').className='fighter'};ui();</script></body></html>
