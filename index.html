STRAIGHT</button><button class="atk" data-a="body"><b>↘</b>BODY</button><button class="def" id="guard"><b>◆</b>GUARD</button><button class="def" id="sway"><b>↔</b>SWAY</button></div><div id="start"><div class="card"><h1>VS TIFA</h1><div class="sub">BETA 0.9</div><div class="tips">パンチでHPを削る。ATTACK表示に合わせてGUARDかSWAY。タイミングよく避けるとCOUNTER。</div><button id="fight" class="primary" type="button">FIGHT</button></div></div><div id="result"><div class="card"><h1 id="res">RESULT</h1><div class="sub" id="score"></div><button id="again" class="primary" type="button">REMATCH</button></div></div></div><script>var eh=100,ph=100,sec=60,playing=false,guard=false,dodgeUntil=0,counterUntil=0,busy=false,combo=0,best=0,timer=null,ai=null,enemyPending=false;function el(x){return document.getElementById(x)}function ui(){el('eh').style.width=eh+'%';el('ph').style.width=ph+'%';el('time').textContent=sec;el('combo').textContent=combo}function say(s){el('msg').textContent=s;setTimeout(function(){if(el('msg').textContent===s)el('msg').textContent=''},520)}function tell(s,on){var t=el('tell');t.textContent=s;t.className='tell'+(on?' show red':'')}function pose(c,ms){var f=el('fighter');f.className='fighter '+c;setTimeout(function(){f.className='fighter'+(guard?' guarding':'')},ms||390)}function flash(){var i=el('impact');i.className='impact';void i.offsetWidth;i.className='impact show';var g=el('game');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');setTimeout(function(){g.classList.remove('shake')},160)}function end(r){if(!playing)return;playing=false;enemyPending=false;clearInterval(timer);clearTimeout(ai);el('res').textContent=r;el('score').textContent='BEST COMBO '+best;el('result').style.display='flex';tell('',false)}function start(){eh=100;ph=100;sec=60;combo=0;best=0;playing=true;guard=false;busy=false;enemyPending=false;el('start').style.display='none';el('result').style.display='none';el('fighter').className='fighter';ui();clearInterval(timer);clearTimeout(ai);timer=setInterval(function(){if(!playing)return;sec--;ui();if(sec<=0)end(eh<ph?'YOU WIN':eh>ph?'TIFA WINS':'DRAW')},1000);say('FIGHT!');scheduleEnemy()}function attack(type,base,label){if(!playing||busy||enemyPending)return;busy=true;var mul=Date.now()<counterUntil?1.55:1;var dmg=Math.round(base*mul);eh=Math.max(0,eh-dmg);combo++;if(combo>best)best=combo;pose(type==='body'?'bodyhit':type,360);flash();say(mul>1?'COUNTER!':label);ui();setTimeout(function(){busy=false},190);if(eh<=0)end('YOU WIN')}function scheduleEnemy(){if(!playing)return;ai=setTimeout(enemyTelegraph,1200+Math.random()*900)}function enemyTelegraph(){if(!playing)return;enemyPending=true;var r=Math.random(),type=r<.4?'jab':r<.78?'straight':'body';tell(type==='jab'?'ATTACK · JAB':type==='straight'?'ATTACK · STRAIGHT':'ATTACK · BODY',true);el('fighter').className='fighter warning';setTimeout(function(){enemyStrike(type)},520)}function enemyStrike(type){if(!playing)return;enemyPending=false;tell('',false);var now=Date.now(),dodged=now<dodgeUntil;if(dodged){counterUntil=now+850;combo=Math.max(combo,1);best=Math.max(best,combo);pose(Math.random()<.5?'swayL':'swayR',320);say('DODGE!');ui();scheduleEnemy();return}var dmg=type==='jab'?8:type==='straight'?13:11;if(guard)dmg=Math.max(2,Math.round(dmg*.28));ph=Math.max(0,ph-dmg);combo=0;pose(type==='jab'?'enemyjab':type==='straight'?'enemystr':'enemybody',390);if(!guard)flash();say(guard?'BLOCK!':'HIT!');ui();if(ph<=0){end('TIFA WINS');return}scheduleEnemy()}el('fight').onclick=start;el('fight').ontouchend=function(e){e.preventDefault();start()};el('again').onclick=start;var bs=document.querySelectorAll('[data-a]');for(var i=0;i<bs.length;i++){bs[i].onclick=function(){var a=this.getAttribute('data-a');if(a==='jab')attack('jab',5,'JAB!');else if(a==='straight')attack('straight',9,'STRAIGHT!');else attack('body',7,'BODY!')}}el('sway').onclick=function(){if(!playing)return;dodgeUntil=Date.now()+620;pose(Math.random()<.5?'swayL':'swayR',340);say('SWAY')};el('guard').ontouchstart=function(e){e.preventDefault();if(!playing)return;guard=true;el('fighter').className='fighter guarding';say('GUARD')};el('guard').ontouchend=function(e){e.preventDefault();guard=false;el('fighter').className='fighter'};el('guard').onmousedown=function(){if(!playing)return;guard=true;el('fighter').className='fighter guarding'};el('guard').onmouseup=function(){guard=false;el('fighter').className='fighter'};ui();</script></body></html>
