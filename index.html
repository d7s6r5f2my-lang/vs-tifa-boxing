<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>VS TIFA — Cinematic Edition</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}#game{position:fixed;inset:0;background:#02030a}#scene{position:absolute;inset:0;background:url('assets/scene.svg') center/cover no-repeat;transform:scale(1.03);transition:.12s}#scene.hit{transform:scale(1.08) translateX(-1.5%);filter:brightness(1.3)}#scene.enemy{transform:scale(1.08) translateX(1.5%);filter:brightness(.85)}#scene.left{transform:scale(1.07) translateX(5%)}#scene.right{transform:scale(1.07) translateX(-5%)}#veil{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 30%,rgba(0,0,0,.15) 58%,rgba(0,0,0,.72) 100%),linear-gradient(to bottom,rgba(0,0,0,.25),transparent 23%,transparent 67%,rgba(0,0,0,.55));pointer-events:none}.hud{position:absolute;z-index:5;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:grid;grid-template-columns:1fr 74px 1fr;gap:8px}.name{font-size:11px;font-weight:1000;letter-spacing:.15em;text-shadow:0 2px 8px #000}.r{text-align:right}.bar{height:18px;background:#1119;border:1px solid #ffffff66;overflow:hidden}.fill{height:100%;width:100%;transition:.15s}.e{background:linear-gradient(90deg,#850b29,#ff254d,#ff91a5)}.p{background:linear-gradient(90deg,#1167af,#23b9ef,#a8efff)}#time{text-align:center;font-size:30px;font-weight:1000;font-style:italic;text-shadow:0 3px 10px #000}.round{text-align:center;font-size:8px;letter-spacing:.16em}.msg{position:absolute;z-index:7;left:50%;top:23%;transform:translateX(-50%);font-size:clamp(24px,8vw,52px);font-weight:1000;font-style:italic;text-shadow:0 0 18px #ff1744,0 4px 8px #000;white-space:nowrap}.controls{position:absolute;z-index:9;left:7px;right:7px;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.controls button{min-height:58px;border:1px solid #ffffff44;border-radius:12px;background:linear-gradient(#14253be8,#07101de8);color:#fff;font-weight:1000;font-size:9px;backdrop-filter:blur(8px)}.controls b{display:block;font-size:19px}.controls button:active{transform:translateY(1px);filter:brightness(1.35)}.atk{border-bottom:3px solid #ff405c!important}.def{border-bottom:3px solid #46bde9!important}#start,#result{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:#02030ab8;backdrop-filter:blur(5px)}#result{display:none}.card{text-align:center;padding:30px;width:min(86vw,430px);background:#07101ee8;border:1px solid #ffffff44;border-radius:22px;box-shadow:0 25px 70px #000}h1{font-size:clamp(44px,13vw,74px);font-style:italic;margin:0;line-height:.9}.sub{letter-spacing:.22em;color:#ff5574;font-weight:1000;margin:10px 0 24px}#fight,#again{padding:14px 42px;border:0;border-radius:10px;background:linear-gradient(#ff4d68,#b70d2b);color:#fff;font-size:23px;font-weight:1000}.note{font-size:11px;color:#cbd9e7;margin-top:13px}</style></head><body><div id="game"><div id="scene"></div><div id="veil"></div><div class="hud"><div><div class="name">TIFA</div><div class="bar"><div id="eh" class="fill e"></div></div></div><div><div class="round">ROUND 1</div><div id="time">60</div></div><div><div class="name r">YOU</div><div class="bar"><div id="ph" class="fill p"></div></div></div></div><div id="msg" class="msg"></div><div class="controls"><button class="atk" data-a="jab"><b>🥊</b>JAB</button><button class="atk" data-a="straight"><b>💥</b>STRAIGHT</button><button class="atk" data-a="body"><b>↘</b>BODY</button><button class="def" id="guard"><b>◆</b>GUARD</button><button class="def" data-a="left"><b>←</b>SWAY</button><button class="def" data-a="right"><b>→</b>SWAY</button></div><div id="start"><div class="card"><h1>VS TIFA</h1><div class="sub">CINEMATIC FIX</div><button id="fight">FIGHT</button><div class="note">Safari表示不具合を修正した安定版</div></div></div><div id="result"><div class="card"><h1 id="res"></h1><button id="again">REMATCH</button></div></div></div><script>(()=>{'use strict';const $=x=>document.getElementById(x),s=$('scene');let eh=100,ph=100,t=60,on=0,guard=0,dodge=0,busy=0,timer,ai;function ui(){$('eh').style.width=eh+'%';$('ph').style.width=ph+'%';$('time').textContent=t}function msg(x,m=420){$('msg').textContent=x;setTimeout(()=>{if($('msg').textContent===x)$('msg').textContent=''},m)}function anim(c,m=130){s.className=c;setTimeout(()=>s.className='',m)}function end(r){if(!on)return;on=0;clearInterval(timer);clearInterval(ai);$('res').textContent=r;$('result').style.display='flex'}function hit(d,l){if(!on||busy)return;busy=1;eh=Math.max(0,eh-d);anim('hit');msg(l);ui();if(navigator.vibrate)navigator.vibrate(18);setTimeout(()=>busy=0,150);if(eh<=0)end('YOU WIN')}function act(a){if(a==='jab')hit(5,'JAB!');if(a==='straight')hit(9,'STRAIGHT!');if(a==='body')hit(7,'BODY!');if(a==='left'||a==='right'){dodge=Date.now()+450;anim(a,220);msg('SWAY')}}function enemy(){if(!on)return;msg('ATTACK!',520);setTimeout(()=>{if(!on)return;if(Date.now()<dodge){msg('DODGE!');return}let d=guard?3:11;ph=Math.max(0,ph-d);anim('enemy');msg(guard?'BLOCK':'HIT');ui();if(navigator.vibrate)navigator.vibrate(guard?20:45);if(ph<=0)end('TIFA WINS')},520)}function start(){eh=ph=100;t=60;on=1;guard=0;dodge=0;ui();$('start').style.display='none';$('result').style.display='none';clearInterval(timer);clearInterval(ai);timer=setInterval(()=>{t--;ui();if(t<=0)end(eh<ph?'YOU WIN':eh>ph?'TIFA WINS':'DRAW')},1000);ai=setInterval(enemy,1800);msg('FIGHT!',700)}document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('pointerdown',()=>act(b.dataset.a)));$('guard').addEventListener('pointerdown',()=>{guard=1;msg('GUARD')});['pointerup','pointercancel','pointerleave'].forEach(e=>$('guard').addEventListener(e,()=>guard=0));$('fight').onclick=start;$('again').onclick=start;ui()})();</script></body></html>
