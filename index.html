<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>VS TIFA</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}#game{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#38445b 0,#171e2c 42%,#070a10 78%);overflow:hidden}.ring{position:absolute;inset:0;background:linear-gradient(transparent 68%,#17202d 69%,#0a0d13 100%)}.rope{position:absolute;left:-5%;right:-5%;height:4px;background:#e33949;box-shadow:0 0 8px #f33}.r1{top:50%}.r2{top:62%;background:#3998e8}.r3{top:74%}.fighter{position:absolute;left:50%;top:52%;width:180px;height:350px;transform:translate(-50%,-50%);transform-origin:50% 65%;transition:transform .08s}.hair{position:absolute;left:50%;top:20px;width:100px;height:185px;transform:translateX(-50%);background:#171315;border-radius:50px 50px 42px 42px}.head{position:absolute;left:50%;top:34px;width:76px;height:92px;transform:translateX(-50%);background:#d7a07f;border-radius:45% 45% 48% 48%;z-index:2}.bang{position:absolute;top:30px;left:55px;width:18px;height:75px;background:#171315;border-radius:50%;transform:rotate(24deg);z-index:3}.bang.b2{left:106px;height:65px;transform:rotate(-22deg)}.body{position:absolute;left:50%;top:115px;width:105px;height:125px;transform:translateX(-50%);background:linear-gradient(90deg,#e8e9eb,#fff,#d8d9dc);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);border-radius:22px}.waist{position:absolute;left:50%;top:218px;width:92px;height:58px;transform:translateX(-50%);background:#12141a;border-radius:12px}.arm{position:absolute;top:125px;width:34px;height:130px;background:#d7a07f;border-radius:18px;transform-origin:50% 12%;z-index:4}.arm.l{left:27px;transform:rotate(18deg)}.arm.r{right:27px;transform:rotate(-18deg)}.sleeve{position:absolute;bottom:0;left:2px;width:30px;height:67px;background:#171a20;border-radius:15px}.glove{position:absolute;bottom:-23px;left:-7px;width:48px;height:48px;background:#a51f2f;border-radius:48% 48% 45% 45%;box-shadow:inset -7px -7px 0 #73121d}.leg{position:absolute;top:260px;width:40px;height:105px;background:#17191e;border-radius:18px}.leg.l{left:48px}.leg.r{right:48px}.hud{position:absolute;z-index:8;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:grid;grid-template-columns:1fr 62px 1fr;gap:7px}.name{font-size:10px;font-weight:900}.right{text-align:right}.bar{height:14px;border:1px solid #ffffff55;background:#0b0e14;overflow:hidden}.fill{height:100%;width:100%;transition:width .15s}.eh{background:#69df71}.ph{background:#ff4c5d}#time{text-align:center;font-size:28px;font-weight:900}.round{text-align:center;font-size:7px}.msg{position:absolute;z-index:12;left:50%;top:19%;transform:translateX(-50%);font-size:38px;font-weight:1000;font-style:italic;text-shadow:0 0 16px #8451ff,0 3px 7px #000}.controls{position:absolute;z-index:15;left:7px;right:7px;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.controls button{min-height:60px;border:1px solid #ffffff45;border-radius:12px;background:#101724ed;color:#fff;font-size:9px;font-weight:900;touch-action:manipulation}.controls b{display:block;font-size:20px}.atk{border-bottom:3px solid #ff5064!important}.def{border-bottom:3px solid #58c8ff!important}#start,#result{position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:#040711d9}#result{display:none}.card{text-align:center;width:min(86vw,400px);padding:30px 22px;background:#0b101a;border:1px solid #ffffff38;border-radius:18px}.card h1{margin:0;font-size:58px;font-style:italic}.sub{margin:8px 0 22px;color:#c19aff;font-weight:900}.primary{padding:16px 48px;border:0;border-radius:10px;background:#7540df;color:#fff;font-size:23px;font-weight:1000;touch-action:manipulation}.combo{position:absolute;z-index:9;right:12px;bottom:92px}.combo b{font-size:40px}.status{position:absolute;z-index:9;left:10px;bottom:92px;font-size:10px;background:#080c14c9;padding:6px 9px;border-radius:8px}.jab .arm.l{animation:jab .22s}.straight .arm.r{animation:straight .28s}.bodyhit{animation:body .3s}.sway{animation:sway .35s}.hurt{animation:hurt .3s}.enemyatk{animation:enemy .32s}@keyframes jab{50%{transform:rotate(88deg) translateY(-55px) scaleY(1.25)}}@keyframes straight{50%{transform:rotate(-88deg) translateY(-62px) scaleY(1.3)}}@keyframes body{50%{transform:translate(-50%,-46%) rotate(-7deg) scale(1.04)}}@keyframes sway{50%{transform:translate(-75%,-50%) rotate(-8deg)}}@keyframes hurt{40%{transform:translate(-40%,-52%) rotate(9deg)}}@keyframes enemy{50%{transform:translate(-50%,-50%) scale(1.12)}}</style></head><body><div id="game"><div class="rope r1"></div><div class="rope r2"></div><div class="rope r3"></div><div class="ring"></div><div id="fighter" class="fighter"><div class="hair"></div><div class="head"></div><div class="bang"></div><div class="bang b2"></div><div class="body"></div><div class="waist"></div><div class="arm l"><div class="sleeve"></div><div class="glove"></div></div><div class="arm r"><div class="sleeve"></div><div class="glove"></div></div><div class="leg l"></div><div class="leg r"></div></div><div class="hud"><div><div class="name">TIFA LOCKHART</div><div class="bar"><div id="eh" class="fill eh"></div></div></div><div><div class="round">ROUND 1</div><div id="time">60</div></div><div><div class="name right">YOU</div><div class="bar"><div id="ph" class="fill ph"></div></div></div></div><div id="msg" class="msg"></div><div class="status">SAFARI STABLE</div><div class="combo"><b id="combo">0</b> HIT</div><div class="controls"><button class="atk" data-a="jab"><b>🥊</b>JAB</button><button class="atk" data-a="straight"><b>💥</b>STRAIGHT</button><button class="atk" data-a="body"><b>↘</b>BODY</button><button class="def" id="guard"><b>◆</b>GUARD</button><button class="def" id="sway"><b>↔</b>SWAY</button></div><div id="start"><div class="card"><h1>VS TIFA</h1><div class="sub">SAFARI STABLE BUILD</div><button id="fight" class="primary" type="button">FIGHT</button></div></div><div id="result"><div class="card"><h1 id="res">RESULT</h1><button id="again" class="primary" type="button">REMATCH</button></div></div></div><script>var eh=100,ph=100,sec=60,playing=false,guard=false,dodgeUntil=0,busy=false,combo=0,timer=null,ai=null;function el(id){return document.getElementById(id)}function ui(){el('eh').style.width=eh+'%';el('ph').style.width=ph+'%';el('time').textContent=sec;el('combo').textContent=combo}function say(s){el('msg').textContent=s;setTimeout(function(){if(el('msg').textContent===s)el('msg').textContent=''},500)}function anim(c){var f=el('fighter');f.className='fighter';void f.offsetWidth;f.className='fighter '+c;setTimeout(function(){f.className='fighter'},380)}function end(r){if(!playing)return;playing=false;clearInterval(timer);clearInterval(ai);el('res').textContent=r;el('result').style.display='flex'}function start(){eh=100;ph=100;sec=60;combo=0;playing=true;guard=false;el('start').style.display='none';el('result').style.display='none';ui();clearInterval(timer);clearInterval(ai);timer=setInterval(function(){if(!playing)return;sec--;ui();if(sec<=0)end(eh<ph?'YOU WIN':eh>ph?'TIFA WINS':'DRAW')},1000);ai=setInterval(enemy,1900);say('FIGHT!')}function attack(type,dmg,label){if(!playing||busy)return;busy=true;eh=Math.max(0,eh-dmg);combo++;anim(type==='body'?'bodyhit':type);say(label);ui();setTimeout(function(){busy=false},180);if(eh<=0)end('YOU WIN')}function enemy(){if(!playing)return;say('ATTACK!');anim('enemyatk');setTimeout(function(){if(!playing)return;if(Date.now()<dodgeUntil){say('DODGE!');return}ph=Math.max(0,ph-(guard?3:11));combo=0;anim('hurt');say(guard?'BLOCK':'HIT!');ui();if(ph<=0)end('TIFA WINS')},520)}el('fight').onclick=start;el('fight').ontouchend=function(e){e.preventDefault();start()};el('again').onclick=start;var bs=document.querySelectorAll('[data-a]');for(var i=0;i<bs.length;i++){bs[i].onclick=function(){var a=this.getAttribute('data-a');if(a==='jab')attack('jab',5,'JAB!');else if(a==='straight')attack('straight',9,'STRAIGHT!');else attack('body',7,'BODY!')}}el('sway').onclick=function(){if(!playing)return;dodgeUntil=Date.now()+600;anim('sway');say('SWAY')};el('guard').ontouchstart=function(e){e.preventDefault();guard=true;say('GUARD')};el('guard').ontouchend=function(e){e.preventDefault();guard=false};el('guard').onmousedown=function(){guard=true;say('GUARD')};el('guard').onmouseup=function(){guard=false};ui();</script></body></html>
