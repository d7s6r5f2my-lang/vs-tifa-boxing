<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>VS TIFA — Fight Night</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03040a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}#game{position:fixed;inset:0;background:#02030a;overflow:hidden}#scene{position:absolute;inset:-3%;background:url('assets/game_visual.jpg') center 44%/cover no-repeat;transform:scale(1.03);transition:transform .13s ease,filter .13s ease}#scene.hit{transform:scale(1.085) translateX(-1.8%);filter:brightness(1.25) saturate(1.2)}#scene.enemy{transform:scale(1.09) translateX(1.5%);filter:brightness(.72) saturate(1.15)}#scene.left{transform:scale(1.07) translateX(5%)}#scene.right{transform:scale(1.07) translateX(-5%)}#veil{position:absolute;inset:0;background:linear-gradient(#0008,transparent 17%,transparent 68%,#000c),radial-gradient(circle at 50% 47%,transparent 34%,#0008 100%);pointer-events:none}.hud{position:absolute;z-index:5;top:max(7px,env(safe-area-inset-top));left:8px;right:8px;display:grid;grid-template-columns:1fr 64px 1fr;gap:7px}.name{font-size:10px;font-weight:900;letter-spacing:.12em;text-shadow:0 2px 7px #000}.r{text-align:right}.bar{height:14px;background:#0a0d15cc;border:1px solid #ffffff55;clip-path:polygon(0 0,100% 0,96% 100%,0 100%);overflow:hidden}.fill{height:100%;transition:.16s}.e{background:linear-gradient(90deg,#52df6d,#9cff84)}.p{background:linear-gradient(90deg,#ff334d,#ff8b63)}#time{text-align:center;font-size:28px;font-weight:1000;font-style:italic;text-shadow:0 3px 9px #000}.round{text-align:center;font-size:7px;letter-spacing:.13em}.msg{position:absolute;z-index:8;left:50%;top:20%;transform:translateX(-50%);font-size:clamp(24px,8vw,50px);font-weight:1000;font-style:italic;text-shadow:0 0 18px #8a4dff,0 4px 8px #000;white-space:nowrap}.combo{position:absolute;right:13px;bottom:93px;z-index:7;text-align:right;font-style:italic;text-shadow:0 0 15px #7f4cff,0 3px 8px #000}.combo b{font-size:42px}.combo span{font-size:16px;font-weight:900}.ex{position:absolute;left:12px;bottom:94px;z-index:7;font-size:12px;font-weight:900}.exbar{width:115px;height:9px;border:1px solid #fff7;background:#130b22cc}.exfill{height:100%;width:100%;background:linear-gradient(90deg,#7c35ff,#e26fff)}.controls{position:absolute;z-index:9;left:7px;right:7px;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.controls button{min-height:58px;border:1px solid #ffffff45;border-radius:12px;background:linear-gradient(#161c2bea,#080b13ed);color:#fff;font-weight:900;font-size:9px;backdrop-filter:blur(8px)}.controls button:active{transform:translateY(1px) scale(.97);filter:brightness(1.4)}.controls b{display:block;font-size:19px}.atk{border-bottom:3px solid #ff5065!important}.def{border-bottom:3px solid #6ac9ff!important}#start,#result{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:#03040aaa;backdrop-filter:blur(4px)}#result{display:none}.card{text-align:center;padding:28px 25px;width:min(86vw,420px);background:#080b15e8;border:1px solid #ffffff3d;border-radius:18px}.card h1{font-size:clamp(42px,13vw,70px);font-style:italic;margin:0;line-height:.9}.sub{letter-spacing:.19em;color:#bf8cff;font-weight:900;margin:10px 0 22px}.primary{padding:14px 42px;border:0;border-radius:9px;background:linear-gradient(#8a4dff,#5322bc);color:white;font-size:22px;font-weight:1000}.tip{font-size:11px;color:#d3d6e2;margin-top:12px}</style></head><body><div id="game"><div id="scene"></div><div id="veil"></div><div class="hud"><div><div class="name">TIFA LOCKHART</div><div class="bar"><div id="eh" class="fill e"></div></div></div><div><div class="round">ROUND 1</div><div id="time">60</div></div><div><div class="name r">YOU</div><div class="bar"><div id="ph" class="fill p"></div></div></div></div><div id="msg" class="msg"></div><div class="ex">EX 100%<div class="exbar"><div class="exfill"></div></div></div><div class="combo"><b id="comboN">0</b> <span>HIT<br>COMBO</span></div><div class="controls"><button class="atk" data-a="jab"><b>🥊</b>JAB</button><button class="atk" data-a="straight"><b>💥</b>STRAIGHT</button><button class="atk" data-a="body"><b>↘</b>BODY</button><button class="def" id="guard"><b>◆</b>GUARD</button><button class="def" id="sway"><b>↔</b>SWAY</button></div><div id="start"><div class="card"><h1>VS TIFA</h1><div class="sub">FIGHT NIGHT</div><button id="fight" class="primary">FIGHT</button><div class="tip">攻撃をつないでコンボ。ATTACK!が見えたらガードかスウェイ。</div></div></div><div id="result"><div class="card"><h1 id="res"></h1><button id="again" class="primary">REMATCH</button></div></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),scene=$('scene');let eh=100,ph=100,t=60,on=false,guard=false,dodgeUntil=0,busy=false,combo=0,comboTimer,timer,ai;function ui(){$('eh').style.width=eh+'%';$('ph').style.width=ph+'%';$('time').textContent=t;$('comboN').textContent=combo}function say(s,ms=420){$('msg').textContent=s;setTimeout(()=>{if($('msg').textContent===s)$('msg').textContent=''},ms)}function anim(c,ms=140){scene.className=c;setTimeout(()=>scene.className='',ms)}function end(r){if(!on)return;on=false;clearInterval(timer);clearInterval(ai);clearTimeout(comboTimer);$('res').textContent=r;$('result').style.display='flex'}function playerHit(d,label){if(!on||busy)return;busy=true;eh=Math.max(0,eh-d);combo++;clearTimeout(comboTimer);comboTimer=setTimeout(()=>{combo=0;ui()},1200);anim('hit');say(label);ui();if(navigator.vibrate)navigator.vibrate(15);setTimeout(()=>busy=false,145);if(eh<=0)end('YOU WIN')}function sway(){if(!on)return;dodgeUntil=Date.now()+520;scene.className=Math.random()>.5?'left':'right';say('SWAY');setTimeout(()=>scene.className='',240)}function enemy(){if(!on)return;say('ATTACK!',520);setTimeout(()=>{if(!on)return;if(Date.now()<dodgeUntil){say('DODGE!');combo++;ui();return}let d=guard?3:10+Math.floor(Math.random()*5);ph=Math.max(0,ph-d);combo=0;anim('enemy',180);say(guard?'BLOCK':'HIT!');ui();if(navigator.vibrate)navigator.vibrate(guard?18:40);if(ph<=0)end('TIFA WINS')},520)}function start(){eh=ph=100;t=60;combo=0;on=true;guard=false;dodgeUntil=0;ui();$('start').style.display='none';$('result').style.display='none';clearInterval(timer);clearInterval(ai);timer=setInterval(()=>{t--;ui();if(t<=0)end(eh<ph?'YOU WIN':eh>ph?'TIFA WINS':'DRAW')},1000);ai=setInterval(enemy,1850);say('FIGHT!',700)}document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('pointerdown',()=>{const a=b.dataset.a;if(a==='jab')playerHit(5,'JAB!');if(a==='straight')playerHit(9,'STRAIGHT!');if(a==='body')playerHit(7,'BODY!')}));$('guard').addEventListener('pointerdown',()=>{guard=true;say('GUARD')});['pointerup','pointercancel','pointerleave'].forEach(e=>$('guard').addEventListener(e,()=>guard=false));$('sway').addEventListener('pointerdown',sway);$('fight').onclick=start;$('again').onclick=start;ui()})();</script></body></html>
