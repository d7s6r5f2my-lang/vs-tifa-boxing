<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>VS TIFA 3D</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b11;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}#game{position:fixed;inset:0;background:radial-gradient(circle at 50% 25%,#2b3140,#121722 48%,#080a0f 78%);overflow:hidden}canvas{position:absolute;inset:0;width:100%!important;height:100%!important}.hud{position:absolute;z-index:5;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:grid;grid-template-columns:1fr 62px 1fr;gap:7px;text-shadow:0 2px 7px #000}.name{font-size:10px;font-weight:900;letter-spacing:.14em}.r{text-align:right}.bar{height:14px;border:1px solid #ffffff55;background:#0c1018cc;overflow:hidden}.fill{height:100%;transition:.15s}.e{background:linear-gradient(90deg,#58d56d,#a6ff83)}.p{background:linear-gradient(90deg,#ff3f57,#ff8b68)}#time{text-align:center;font-size:28px;font-weight:1000}.round{text-align:center;font-size:7px;letter-spacing:.15em}.msg{position:absolute;z-index:6;left:50%;top:19%;transform:translateX(-50%);font-size:clamp(24px,8vw,50px);font-weight:1000;font-style:italic;text-shadow:0 0 18px #834dff,0 3px 8px #000}.controls{position:absolute;z-index:8;left:7px;right:7px;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.controls button{min-height:58px;border:1px solid #ffffff45;border-radius:12px;background:linear-gradient(#18202de8,#080b12f2);color:#fff;font-size:9px;font-weight:900}.controls b{display:block;font-size:19px}.atk{border-bottom:3px solid #ff5064!important}.def{border-bottom:3px solid #58c8ff!important}#start,#result{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:#060811b8;backdrop-filter:blur(4px)}#result{display:none}.card{text-align:center;width:min(86vw,420px);padding:28px 24px;background:#0b101aeb;border:1px solid #ffffff35;border-radius:18px}.card h1{margin:0;font-size:clamp(42px,13vw,72px);font-style:italic;line-height:.92}.sub{margin:10px 0 22px;letter-spacing:.17em;color:#bd91ff;font-weight:900}.primary{padding:14px 42px;border:0;border-radius:9px;background:linear-gradient(#8a4dff,#5422bd);color:#fff;font-size:22px;font-weight:1000}.status{position:absolute;z-index:6;left:10px;bottom:92px;font-size:10px;background:#080c14b8;border:1px solid #ffffff24;border-radius:8px;padding:6px 9px}.combo{position:absolute;z-index:6;right:13px;bottom:92px;text-align:right;font-style:italic}.combo b{font-size:42px}.combo span{font-size:15px;font-weight:900}</style></head><body><div id="game"><div class="hud"><div><div class="name">TIFA LOCKHART</div><div class="bar"><div id="eh" class="fill e"></div></div></div><div><div class="round">ROUND 1</div><div id="time">60</div></div><div><div class="name r">YOU</div><div class="bar"><div id="ph" class="fill p"></div></div></div></div><div id="msg" class="msg"></div><div class="status" id="status">3D READY</div><div class="combo"><b id="comboN">0</b> <span>HIT<br>COMBO</span></div><div class="controls"><button class="atk" data-a="jab"><b>🥊</b>JAB</button><button class="atk" data-a="straight"><b>💥</b>STRAIGHT</button><button class="atk" data-a="body"><b>↘</b>BODY</button><button class="def" id="guard"><b>◆</b>GUARD</button><button class="def" id="sway"><b>↔</b>SWAY</button></div><div id="start"><div class="card"><h1>VS TIFA</h1><div class="sub">LIGHTWEIGHT 3D</div><button id="fight" class="primary">FIGHT</button></div></div><div id="result"><div class="card"><h1 id="res"></h1><button id="again" class="primary">REMATCH</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script><script>(()=>{'use strict';const $=x=>document.getElementById(x),game=$('game');if(!window.THREE){$('status').textContent='3D LOAD ERROR';return}const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x090b11,6,16);const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,50);camera.position.set(0,1.55,5.1);camera.lookAt(0,1.4,0);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;game.insertBefore(renderer.domElement,game.firstChild);scene.add(new THREE.HemisphereLight(0xcfe2ff,0x22150c,2.2));const dl=new THREE.DirectionalLight(0xffffff,4);dl.position.set(-3,5,4);scene.add(dl);const rim=new THREE.DirectionalLight(0x8ab8ff,3);rim.position.set(3,3,-2);scene.add(rim);const floor=new THREE.Mesh(new THREE.CircleGeometry(5,48),new THREE.MeshStandardMaterial({color:0x1a1f29,roughness:.75,metalness:.08}));floor.rotation.x=-Math.PI/2;scene.add(floor);const grid=new THREE.GridHelper(8,12,0x334f6c,0x202a38);grid.position.y=.01;scene.add(grid);function mat(c,r=.55){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:.04})}function capsule(len,r,c){const g=new THREE.Group(),mid=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,16),mat(c)),a=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat(c)),b=a.clone();mid.position.y=0;a.position.y=len/2;b.position.y=-len/2;g.add(mid,a,b);return g}const root=new THREE.Group();scene.add(root);const skin=0xd8a17f,black=0x101116,white=0xe8ebef,red=0xa51f2e,hair=0x171312;const hips=new THREE.Mesh(new THREE.SphereGeometry(.36,20,14),mat(black));hips.scale.set(1.08,.72,.72);hips.position.y=.95;root.add(hips);const torso=new THREE.Mesh(new THREE.SphereGeometry(.58,24,18),mat(white,.42));torso.scale.set(.9,1.05,.58);torso.position.y=1.55;root.add(torso);const chest=new THREE.Mesh(new THREE.SphereGeometry(.5,22,16),mat(white,.42));chest.scale.set(1.05,.72,.62);chest.position.y=1.78;root.add(chest);const neck=capsule(.22,.095,skin);neck.position.y=2.13;root.add(neck);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,24,18),mat(skin,.5));head.scale.set(.88,1.08,.88);head.position.y=2.42;root.add(head);const hairBack=new THREE.Mesh(new THREE.SphereGeometry(.31,22,18),mat(hair,.65));hairBack.scale.set(1,1.2,.95);hairBack.position.set(0,2.45,-.08);root.add(hairBack);const face=new THREE.Mesh(new THREE.SphereGeometry(.265,22,18),mat(skin,.5));face.scale.set(.88,1.02,.82);face.position.set(0,2.42,.08);root.add(face);const eyeMat=mat(0x2b1b17,.4);[-.095,.095].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.028,10,8),eyeMat);e.position.set(x,2.46,.305);root.add(e)});const bang1=capsule(.33,.055,hair),bang2=capsule(.29,.05,hair);bang1.rotation.z=.42;bang2.rotation.z=-.35;bang1.position.set(-.08,2.57,.22);bang2.position.set(.11,2.55,.22);root.add(bang1,bang2);const pony=capsule(1.05,.13,hair);pony.rotation.z=.05;pony.position.set(0,1.95,-.28);root.add(pony);function arm(side){const s=side,grp=new THREE.Group();grp.position.set(.52*s,1.9,0);root.add(grp);const upper=capsule(.62,.115,skin);upper.position.y=-.28;grp.add(upper);const elbow=new THREE.Group();elbow.position.y=-.6;grp.add(elbow);const fore=capsule(.55,.105,black);fore.position.y=-.25;elbow.add(fore);const glove=new THREE.Mesh(new THREE.SphereGeometry(.19,18,14),mat(red,.38));glove.scale.set(1.15,.95,1.2);glove.position.set(0,-.58,.04);elbow.add(glove);return{grp,elbow,glove}}const L=arm(-1),R=arm(1);L.grp.rotation.z=-.35;R.grp.rotation.z=.35;L.elbow.rotation.x=-1.15;R.elbow.rotation.x=-1.15;L.elbow.rotation.z=.16;R.elbow.rotation.z=-.16;function leg(side){const g=new THREE.Group();g.position.set(.23*side,.8,0);root.add(g);const thigh=capsule(.72,.16,black);thigh.position.y=-.34;g.add(thigh);const knee=new THREE.Group();knee.position.y=-.72;g.add(knee);const shin=capsule(.68,.135,skin);shin.position.y=-.32;knee.add(shin);return g}leg(-1);leg(1);root.position.y=.08;root.rotation.y=0;let action=null;function reset(){root.position.x=0;root.position.z=0;root.rotation.set(0,0,0);torso.rotation.set(0,0,0);chest.rotation.set(0,0,0);L.grp.rotation.set(0,0,-.35);R.grp.rotation.set(0,0,.35);L.elbow.rotation.set(-1.15,0,.16);R.elbow.rotation.set(-1.15,0,-.16)}function animateMove(type,ms){if(action)cancelAnimationFrame(action);reset();const st=performance.now();function f(now){const p=Math.min(1,(now-st)/ms),s=Math.sin(p*Math.PI);if(type==='jab'){L.grp.rotation.x=-1.25*s;L.elbow.rotation.x=-1.15+1.05*s;root.position.z=.22*s}if(type==='straight'){R.grp.rotation.x=-1.35*s;R.elbow.rotation.x=-1.15+1.08*s;torso.rotation.y=-.28*s;root.position.z=.3*s}if(type==='body'){R.grp.rotation.x=-1.05*s;R.elbow.rotation.x=-1.15+.95*s;torso.rotation.x=.2*s;root.position.y=.08-.08*s}if(type==='swayL'){root.position.x=-.42*s;root.rotation.z=-.12*s}if(type==='swayR'){root.position.x=.42*s;root.rotation.z=.12*s}if(type==='hit'){root.position.x=.25*s;root.rotation.z=.16*s;head.rotation.z=.2*s}if(type==='enemy'){root.position.z=.4*s}if(p<1)action=requestAnimationFrame(f);else{reset();head.rotation.set(0,0,0)}}action=requestAnimationFrame(f)}let eh=100,ph=100,t=60,on=false,guard=false,dodge=0,busy=false,combo=0,ct,timer,ai;function ui(){$('eh').style.width=eh+'%';$('ph').style.width=ph+'%';$('time').textContent=t;$('comboN').textContent=combo}function say(x,m=420){$('msg').textContent=x;setTimeout(()=>{if($('msg').textContent===x)$('msg').textContent=''},m)}function end(r){if(!on)return;on=false;clearInterval(timer);clearInterval(ai);$('res').textContent=r;$('result').style.display='flex'}function hit(d,l,type){if(!on||busy)return;busy=true;eh=Math.max(0,eh-d);combo++;clearTimeout(ct);ct=setTimeout(()=>{combo=0;ui()},1100);animateMove(type,type==='jab'?190:250);say(l);ui();if(navigator.vibrate)navigator.vibrate(12);setTimeout(()=>busy=false,170);if(eh<=0)end('YOU WIN')}function sway(){if(!on)return;dodge=Date.now()+520;animateMove(Math.random()>.5?'swayL':'swayR',320);say('SWAY')}function enemy(){if(!on)return;say('ATTACK!',500);animateMove('enemy',260);setTimeout(()=>{if(!on)return;if(Date.now()<dodge){say('DODGE!');return}const d=guard?3:11;ph=Math.max(0,ph-d);combo=0;animateMove('hit',230);say(guard?'BLOCK':'HIT!');ui();if(ph<=0)end('TIFA WINS')},500)}function start(){eh=ph=100;t=60;combo=0;on=true;ui();$('start').style.display='none';$('result').style.display='none';clearInterval(timer);clearInterval(ai);timer=setInterval(()=>{t--;ui();if(t<=0)end(eh<ph?'YOU WIN':eh>ph?'TIFA WINS':'DRAW')},1000);ai=setInterval(enemy,1900);say('FIGHT!',700)}document.querySelectorAll('[data-a]').forEach(b=>b.onpointerdown=()=>{const a=b.dataset.a;if(a==='jab')hit(5,'JAB!','jab');if(a==='straight')hit(9,'STRAIGHT!','straight');if(a==='body')hit(7,'BODY!','body')});$('sway').onpointerdown=sway;$('guard').onpointerdown=()=>{guard=true;L.grp.rotation.x=-.55;R.grp.rotation.x=-.55;say('GUARD')};['pointerup','pointercancel','pointerleave'].forEach(e=>$('guard').addEventListener(e,()=>{guard=false;reset()}));$('fight').onclick=start;$('again').onclick=start;function loop(){requestAnimationFrame(loop);if(!on){root.position.y=.08+Math.sin(performance.now()*.002)*.018;root.rotation.y=Math.sin(performance.now()*.0012)*.025}renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});ui()})();</script></body></html>
