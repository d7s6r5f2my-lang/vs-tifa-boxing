<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>VS TIFA</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060910;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}#game{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 22%,#53627c,#263247 25%,#101725 52%,#05080d 82%)}.crowd{position:absolute;left:0;right:0;top:30%;height:32%;opacity:.45;background:radial-gradient(circle at 10% 40%,#fff 0 1px,transparent 2px),radial-gradient(circle at 25% 70%,#fff 0 1px,transparent 2px),radial-gradient(circle at 47% 42%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 66%,#fff 0 1px,transparent 2px),radial-gradient(circle at 89% 38%,#fff 0 1px,transparent 2px),linear-gradient(#111927,#05070b)}.floor{position:absolute;left:-12%;right:-12%;bottom:0;height:38%;background:linear-gradient(#354252,#111720);clip-path:polygon(9% 0,91% 0,100% 100%,0 100%)}.rope{position:absolute;left:-5%;right:-5%;height:4px;z-index:2;box-shadow:0 0 8px currentColor}.r1{top:49%;background:#e23d50;color:#e23d50}.r2{top:61%;background:#e9edf2;color:#fff}.r3{top:73%;background:#3998e8;color:#3998e8}.fighter{position:absolute;z-index:6;left:50%;top:52%;width:min(64vw,310px);height:auto;transform:translate(-50%,-50%);transform-origin:50% 62%;filter:drop-shadow(0 22px 18px #0009);animation:idle 1.7s ease-in-out infinite}.fighter svg{display:block;width:100%;height:auto;overflow:visible}.armL,.armR{transform-box:fill-box;transform-origin:50% 10%}.guarding .armL{transform:rotate(43deg) translate(18px,-8px)}.guarding .armR{transform:rotate(-43deg) translate(-18px,-8px)}.jab .armL{animation:jab .23s ease-out}.straight .armR{animation:straight .28s ease-out}.bodyhit{animation:body .3s}.sway{animation:sway .35s}.hurt{animation:hurt .3s}.enemyatk{animation:enemy .32s}.enemyatk .armR{animation:enemyarm .32s}.hud{position:absolute;z-index:20;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:grid;grid-template-columns:1fr 62px 1fr;gap:7px;text-shadow:0 2px 6px #000}.name{font-size:10px;font-weight:900;letter-spacing:.1em}.right{text-align:right}.bar{height:14px;border:1px solid #ffffff55;background:#090d13d9;overflow:hidden}.fill{height:100%;width:100%;transition:width .15s}.eh{background:linear-gradient(90deg,#43ce5e,#9cff76)}.ph{background:linear-gradient(90deg,#ff354e,#ff8b69)}#time{text-align:center;font-size:28px;font-weight:1000}.round{text-align:center;font-size:7px}.msg{position:absolute;z-index:25;left:50%;top:19%;transform:translateX(-50%);font-size:clamp(28px,9vw,52px);font-weight:1000;font-style:italic;text-shadow:0 0 16px #8451ff,0 3px 7px #000;white-space:nowrap}.controls{position:absolute;z-index:30;left:7px;right:7px;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.controls button{min-height:60px;border:1px solid #ffffff45;border-radius:12px;background:linear-gradient(#18202cec,#090d15f2);color:#fff;font-size:9px;font-weight:900;touch-action:manipulation}.controls b{display:block;font-size:20px}.atk{border-bottom:3px solid #ff5064!important}.def{border-bottom:3px solid #58c8ff!important}#start,#result{position:absolute;z-index:40;inset:0;display:flex;align-items:center;justify-content:center;background:#040711df}#result{display:none}.card{text-align:center;width:min(86vw,400px);padding:30px 22px;background:#0b101af2;border:1px solid #ffffff38;border-radius:18px}.card h1{margin:0;font-size:58px;font-style:italic}.sub{margin:8px 0 22px;color:#c19aff;font-weight:900}.primary{padding:16px 48px;border:0;border-radius:10px;background:linear-gradient(#8750f0,#5926b9);color:#fff;font-size:23px;font-weight:1000;touch-action:manipulation}.combo{position:absolute;z-index:22;right:12px;bottom:92px}.combo b{font-size:40px}.status{position:absolute;z-index:22;left:10px;bottom:92px;font-size:10px;background:#080c14c9;padding:6px 9px;border-radius:8px}.impact{position:absolute;z-index:18;left:50%;top:46%;width:20px;height:20px;border:3px solid #fff;border-radius:50%;transform:translate(-50%,-50%) scale(0);opacity:0}.impact.show{animation:impact .25s}.playerglove{position:absolute;z-index:15;bottom:46px;width:105px;height:125px;background:radial-gradient(circle at 38% 25%,#3b424c,#11151b 58%,#050608);border-radius:48%;opacity:.92}.pgl{left:-28px;transform:rotate(24deg)}.pgr{right:-28px;transform:rotate(-24deg)}@keyframes idle{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-51%)}}@keyframes jab{45%{transform:translate(70px,-80px) rotate(68deg) scaleY(1.15)}}@keyframes straight{45%{transform:translate(-72px,-85px) rotate(-70deg) scaleY(1.18)}}@keyframes body{50%{transform:translate(-50%,-47%) rotate(-7deg) scale(1.04)}}@keyframes sway{50%{transform:translate(-76%,-50%) rotate(-8deg)}}@keyframes hurt{40%{transform:translate(-39%,-52%) rotate(10deg)}}@keyframes enemy{45%{transform:translate(-50%,-50%) scale(1.13)}}@keyframes enemyarm{45%{transform:translate(-78px,-88px) rotate(-72deg) scaleY(1.2)}}@keyframes impact{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(5);opacity:0}}</style></head><body><div id="game"><div class="crowd"></div><div class="rope r1"></div><div class="rope r2"></div><div class="rope r3"></div><div class="floor"></div><div id="fighter" class="fighter"><svg viewBox="0 0 300 500" aria-label="Tifa inspired boxer"><defs><linearGradient id="skin" x1="0" x2="1"><stop stop-color="#a95f49"/><stop offset=".42" stop-color="#e4a887"/><stop offset=".72" stop-color="#f0bd9c"/><stop offset="1" stop-color="#a85c47"/></linearGradient><linearGradient id="hair" x1="0" x2="1"><stop stop-color="#08090c"/><stop offset=".5" stop-color="#292329"/><stop offset="1" stop-color="#07080a"/></linearGradient><linearGradient id="white" x1="0" x2="1"><stop stop-color="#aeb5be"/><stop offset=".42" stop-color="#fff"/><stop offset=".68" stop-color="#eef1f4"/><stop offset="1" stop-color="#949da8"/></linearGradient><linearGradient id="black" x1="0" x2="1"><stop stop-color="#080a0e"/><stop offset=".5" stop-color="#303640"/><stop offset="1" stop-color="#080a0d"/></linearGradient><radialGradient id="red"><stop stop-color="#e85462"/><stop offset=".55" stop-color="#a52030"/><stop offset="1" stop-color="#5b0c16"/></radialGradient></defs><path d="M105 80 Q86 105 91 224 L78 353 Q105 325 122 222 L178 222 Q194 326 222 354 L208 208 Q214 107 193 80Z" fill="url(#hair)"/><path d="M187 105 Q224 145 207 345 Q194 305 185 222Z" fill="url(#hair)"/><ellipse cx="150" cy="104" rx="48" ry="60" fill="url(#skin)"/><ellipse cx="104" cy="111" rx="7" ry="15" fill="#c78367"/><ellipse cx="196" cy="111" rx="7" ry="15" fill="#c78367"/><path d="M104 94 Q112 43 151 43 Q191 44 198 94 Q177 62 150 66 Q123 62 104 94Z" fill="url(#hair)"/><path d="M118 54 Q128 80 120 130 Q143 98 145 55Z" fill="url(#hair)"/><path d="M177 55 Q168 82 177 126 Q157 98 154 55Z" fill="url(#hair)"/><path d="M128 96 Q137 91 145 96" fill="none" stroke="#39252a" stroke-width="3" stroke-linecap="round"/><path d="M156 96 Q165 91 174 96" fill="none" stroke="#39252a" stroke-width="3" stroke-linecap="round"/><ellipse cx="137" cy="105" rx="8" ry="5" fill="#f4f1ee"/><ellipse cx="164" cy="105" rx="8" ry="5" fill="#f4f1ee"/><circle cx="138" cy="105" r="4" fill="#6b3c32"/><circle cx="163" cy="105" r="4" fill="#6b3c32"/><circle cx="138" cy="104" r="1.6"/><circle cx="163" cy="104" r="1.6"/><path d="M150 105 Q145 122 151 125" fill="none" stroke="#a65f4f" stroke-width="2"/><path d="M137 138 Q150 145 164 137" fill="none" stroke="#944c51" stroke-width="2.5" stroke-linecap="round"/><path d="M136 155 L164 155 L170 182 L130 182Z" fill="url(#skin)"/><path d="M104 178 Q150 154 196 178 L211 286 L89 286Z" fill="url(#white)"/><path d="M103 177 L119 170 L132 286 L105 286Z" fill="url(#black)"/><path d="M197 177 L181 170 L168 286 L195 286Z" fill="url(#black)"/><path d="M112 214 Q150 232 188 214" fill="none" stroke="#9da5ae" stroke-width="8" opacity=".5"/><path d="M92 280 L208 280 L204 320 L96 320Z" fill="url(#black)"/><rect x="139" y="287" width="23" height="18" rx="3" fill="none" stroke="#aeb5bc" stroke-width="3"/><path d="M98 315 L202 315 L190 375 L158 365 L150 336 L142 365 L110 375Z" fill="url(#black)"/><g class="armL"><path d="M104 180 Q81 186 72 224 L64 285 Q70 300 84 288 L98 234 L118 199Z" fill="url(#skin)"/><path d="M66 267 L87 272 L80 335 L55 328Z" fill="url(#black)"/><ellipse cx="66" cy="337" rx="29" ry="31" fill="url(#red)"/><path d="M51 324 Q65 311 82 325" fill="none" stroke="#f77b85" stroke-width="4" opacity=".5"/></g><g class="armR"><path d="M196 180 Q219 186 228 224 L236 285 Q230 300 216 288 L202 234 L182 199Z" fill="url(#skin)"/><path d="M234 267 L213 272 L220 335 L245 328Z" fill="url(#black)"/><ellipse cx="234" cy="337" rx="29" ry="31" fill="url(#red)"/><path d="M219 325 Q235 311 249 324" fill="none" stroke="#f77b85" stroke-width="4" opacity=".5"/></g><path d="M112 369 L145 363 L142 478 L101 478Z" fill="url(#black)"/><path d="M155 363 L188 369 L199 478 L158 478Z" fill="url(#black)"/><path d="M99 445 L143 445 L142 493 L91 493 Q87 470 99 445Z" fill="#11151b"/><path d="M157 445 L201 445 Q213 470 209 493 L158 493Z" fill="#11151b"/></svg></div><div id="impact" class="impact"></div><div class="playerglove pgl"></div><div class="playerglove pgr"></div><div class="hud"><div><div class="name">TIFA LOCKHART</div><div class="bar"><div id="eh" class="fill eh"></div></div></div><div><div class="round">ROUND 1</div><div id="time">60</div></div><div><div class="name right">YOU</div><div class="bar"><div id="ph" class="fill ph"></div></div></div></div><div id="msg" class="msg"></div><div class="status">LIGHT MODEL</div><div class="combo"><b id="combo">0</b> HIT</div><div class="controls"><button class="atk" data-a="jab"><b>🥊</b>JAB</button><button class="atk" data-a="straight"><b>💥</b>STRAIGHT</button><button class="atk" data-a="body"><b>↘</b>BODY</button><button class="def" id="guard"><b>◆</b>GUARD</button><button class="def" id="sway"><b>↔</b>SWAY</button></div><div id="start"><div class="card"><h1>VS TIFA</h1><div class="sub">LIGHT MODEL BUILD</div><button id="fight" class="primary" type="button">FIGHT</button></div></div><div id="result"><div class="card"><h1 id="res">RESULT</h1><button id="again" class="primary" type="button">REMATCH</button></div></div></div><script>var eh=100,ph=100,sec=60,playing=false,guard=false,dodgeUntil=0,busy=false,combo=0,timer=null,ai=null;function el(x){return document.getElementById(x)}function ui(){el('eh').style.width=eh+'%';el('ph').style.width=ph+'%';el('time').textContent=sec;el('combo').textContent=combo}function say(s){el('msg').textContent=s;setTimeout(function(){if(el('msg').textContent===s)el('msg').textContent=''},500)}function anim(c){var f=el('fighter');f.className='fighter';void f.offsetWidth;f.className='fighter '+c;setTimeout(function(){if(!guard)f.className='fighter'},390)}function flash(){var i=el('impact');i.className='impact';void i.offsetWidth;i.className='impact show'}function end(r){if(!playing)return;playing=false;clearInterval(timer);clearInterval(ai);el('res').textContent=r;el('result').style.display='flex'}function start(){eh=100;ph=100;sec=60;combo=0;playing=true;guard=false;el('start').style.display='none';el('result').style.display='none';ui();clearInterval(timer);clearInterval(ai);timer=setInterval(function(){sec--;ui();if(sec<=0)end(eh<ph?'YOU WIN':eh>ph?'TIFA WINS':'DRAW')},1000);ai=setInterval(enemy,1900);say('FIGHT!')}function attack(type,dmg,label){if(!playing||busy)return;busy=true;eh=Math.max(0,eh-dmg);combo++;anim(type==='body'?'bodyhit':type);flash();say(label);ui();setTimeout(function(){busy=false},180);if(eh<=0)end('YOU WIN')}function enemy(){if(!playing)return;say('ATTACK!');anim('enemyatk');setTimeout(function(){if(!playing)return;if(Date.now()<dodgeUntil){say('DODGE!');return}ph=Math.max(0,ph-(guard?3:11));combo=0;anim('hurt');say(guard?'BLOCK':'HIT!');ui();if(ph<=0)end('TIFA WINS')},520)}el('fight').onclick=start;el('fight').ontouchend=function(e){e.preventDefault();start()};el('again').onclick=start;var bs=document.querySelectorAll('[data-a]');for(var i=0;i<bs.length;i++)bs[i].onclick=function(){var a=this.getAttribute('data-a');if(a==='jab')attack('jab',5,'JAB!');else if(a==='straight')attack('straight',9,'STRAIGHT!');else attack('body',7,'BODY!')};el('sway').onclick=function(){if(!playing)return;dodgeUntil=Date.now()+600;anim('sway');say('SWAY')};function gOn(e){if(e)e.preventDefault();guard=true;el('fighter').className='fighter guarding';say('GUARD')}function gOff(e){if(e)e.preventDefault();guard=false;el('fighter').className='fighter'}el('guard').ontouchstart=gOn;el('guard').ontouchend=gOff;el('guard').onmousedown=gOn;el('guard').onmouseup=gOff;ui();</script></body></html>
