<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>VS TIFA 3D FIX</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b11;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}#game{position:fixed;inset:0;background:radial-gradient(circle at 50% 25%,#30394b,#131923 48%,#080a0f 78%);overflow:hidden}canvas{position:absolute;inset:0;width:100%!important;height:100%!important}.hud{position:absolute;z-index:5;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:grid;grid-template-columns:1fr 62px 1fr;gap:7px}.name{font-size:10px;font-weight:900}.r{text-align:right}.bar{height:14px;border:1px solid #ffffff55;background:#1118;overflow:hidden}.fill{height:100%;transition:.15s}.e{background:#66df70}.p{background:#ff4d5e}#time{text-align:center;font-size:28px;font-weight:900}.round{text-align:center;font-size:7px}.msg{position:absolute;z-index:7;left:50%;top:20%;transform:translateX(-50%);font-size:38px;font-weight:1000;font-style:italic;text-shadow:0 0 15px #804cff}.controls{position:absolute;z-index:10;left:7px;right:7px;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.controls button{min-height:58px;border:1px solid #ffffff44;border-radius:12px;background:#101724e8;color:#fff;font-size:9px;font-weight:900}.controls b{display:block;font-size:19px}.atk{border-bottom:3px solid #ff5064!important}.def{border-bottom:3px solid #58c8ff!important}#start,#result{position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:#050812d9}#result{display:none}.card{text-align:center;width:min(86vw,420px);padding:28px;background:#0b101aec;border:1px solid #ffffff35;border-radius:18px}.card h1{margin:0;font-size:56px;font-style:italic}.sub{margin:8px 0 20px;color:#c09aff;font-weight:900}.primary{position:relative;z-index:40;touch-action:manipulation;padding:16px 48px;border:0;border-radius:10px;background:#7540df;color:#fff;font-size:23px;font-weight:1000}.status{position:absolute;z-index:6;left:10px;bottom:92px;font-size:10px;background:#080c14cc;padding:6px 9px;border-radius:8px}.combo{position:absolute;z-index:6;right:13px;bottom:92px;font-size:13px}.combo b{font-size:40px}</style></head><body><div id="game"><div class="hud"><div><div class="name">TIFA LOCKHART</div><div class="bar"><div id="eh" class="fill e"></div></div></div><div><div class="round">ROUND 1</div><div id="time">60</div></div><div><div class="name r">YOU</div><div class="bar"><div id="ph" class="fill p"></div></div></div></div><div id="msg" class="msg"></div><div id="status" class="status">START READY</div><div class="combo"><b id="comboN">0</b> HIT</div><div class="controls"><button class="atk" data-a="jab"><b>🥊</b>JAB</button><button class="atk" data-a="straight"><b>💥</b>STRAIGHT</button><button class="atk" data-a="body"><b>↘</b>BODY</button><button class="def" id="guard"><b>◆</b>GUARD</button><button class="def" id="sway"><b>↔</b>SWAY</button></div><div id="start"><div class="card"><h1>VS TIFA</h1><div class="sub">iPHONE FIX</div><button type="button" id="fight" class="primary">FIGHT</button></div></div><div id="result"><div class="card"><h1 id="res"></h1><button type="button" id="again" class="primary">REMATCH</button></div></div></div><script>/* startup is deliberately independent of 3D so FIGHT always works on Safari */(()=>{'use strict';const $=x=>document.getElementById(x);let eh=100,ph=100,t=60,on=false,guard=false,dodge=0,busy=false,combo=0,timer=null,ai=null,threeReady=false,root=null,L=null,R=null,head=null,torso=null,renderer=null,scene=null,camera=null,action=null;function ui(){$('eh').style.width=eh+'%';$('ph').style.width=ph+'%';$('time').textContent=t;$('comboN').textContent=combo}function say(s,ms=450){$('msg').textContent=s;setTimeout(()=>{if($('msg').textContent===s)$('msg').textContent=''},ms)}function start(ev){if(ev){ev.preventDefault();ev.stopPropagation()}eh=100;ph=100;t=60;combo=0;on=true;$('start').style.display='none';$('result').style.display='none';ui();clearInterval(timer);clearInterval(ai);timer=setInterval(()=>{if(!on)return;t--;ui();if(t<=0)end(eh<ph?'YOU WIN':eh>ph?'TIFA WINS':'DRAW')},1000);ai=setInterval(enemy,1900);say('FIGHT!',700)}function end(r){if(!on)return;on=false;clearInterval(timer);clearInterval(ai);$('res').textContent=r;$('result').style.display='flex'}function move(type,ms=240){if(!threeReady||!root)return;cancelAnimationFrame(action);const sx=root.position.x,sz=root.position.z,rz=root.rotation.z,st=performance.now();function f(n){let p=Math.min(1,(n-st)/ms),s=Math.sin(Math.PI*p);if(type==='jab'){root.position.z=sz+.18*s;L.grp.rotation.x=-1.15*s}if(type==='straight'){root.position.z=sz+.27*s;R.grp.rotation.x=-1.3*s;torso.rotation.y=-.25*s}if(type==='body'){root.position.y=.08-.1*s;R.grp.rotation.x=-1.05*s}if(type==='sway'){root.position.x=sx+(Math.random()>.5?.38:-.38)*s}if(type==='enemy')root.position.z=sz+.36*s;if(type==='hit'){root.position.x=sx+.22*s;root.rotation.z=rz+.14*s;head.rotation.z=.18*s}if(p<1)action=requestAnimationFrame(f);else reset()}action=requestAnimationFrame(f)}function reset(){if(!root)return;root.position.set(0,.08,0);root.rotation.set(0,0,0);torso.rotation.set(0,0,0);head.rotation.set(0,0,0);L.grp.rotation.set(0,0,-.35);R.grp.rotation.set(0,0,.35);L.elbow.rotation.set(-1.15,0,.16);R.elbow.rotation.set(-1.15,0,-.16)}function hit(d,l,type){if(!on||busy)return;busy=true;eh=Math.max(0,eh-d);combo++;move(type);say(l);ui();setTimeout(()=>busy=false,170);if(eh<=0)end('YOU WIN')}function enemy(){if(!on)return;say('ATTACK!',500);move('enemy');setTimeout(()=>{if(!on)return;if(Date.now()<dodge){say('DODGE!');return}ph=Math.max(0,ph-(guard?3:11));combo=0;move('hit');say(guard?'BLOCK':'HIT!');ui();if(ph<=0)end('TIFA WINS')},500)}function bind(){const fight=$('fight');fight.addEventListener('click',start,{passive:false});fight.addEventListener('touchend',start,{passive:false});$('again').addEventListener('click',start);document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('pointerdown',()=>{const a=b.dataset.a;if(a==='jab')hit(5,'JAB!','jab');if(a==='straight')hit(9,'STRAIGHT!','straight');if(a==='body')hit(7,'BODY!','body')}));$('sway').addEventListener('pointerdown',()=>{if(!on)return;dodge=Date.now()+550;move('sway',320);say('SWAY')});$('guard').addEventListener('pointerdown',()=>{guard=true;say('GUARD')});['pointerup','pointercancel','pointerleave'].forEach(e=>$('guard').addEventListener(e,()=>guard=false))}bind();ui();window.initThree=function(){try{const T=window.THREE;if(!T)throw Error('THREE missing');scene=new T.Scene();camera=new T.PerspectiveCamera(34,innerWidth/innerHeight,.1,50);camera.position.set(0,1.55,5.1);camera.lookAt(0,1.4,0);renderer=new T.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);$('game').insertBefore(renderer.domElement,$('game').firstChild);scene.add(new T.HemisphereLight(0xd8e8ff,0x28180e,2.5));const dl=new T.DirectionalLight(0xffffff,4);dl.position.set(-3,5,4);scene.add(dl);const floor=new T.Mesh(new T.CircleGeometry(5,40),new T.MeshStandardMaterial({color:0x1a202a,roughness:.8}));floor.rotation.x=-Math.PI/2;scene.add(floor);function mat(c){return new T.MeshStandardMaterial({color:c,roughness:.55})}function cap(len,r,c){const g=new T.Group(),m=new T.Mesh(new T.CylinderGeometry(r,r,len,14),mat(c)),a=new T.Mesh(new T.SphereGeometry(r,14,10),mat(c)),b=a.clone();a.position.y=len/2;b.position.y=-len/2;g.add(m,a,b);return g}root=new T.Group();scene.add(root);const skin=0xd8a17f,black=0x111116,white=0xe9edf1,red=0xa92332,hair=0x171312;const hips=new T.Mesh(new T.SphereGeometry(.36,18,12),mat(black));hips.scale.set(1.08,.72,.72);hips.position.y=.95;root.add(hips);torso=new T.Mesh(new T.SphereGeometry(.58,20,14),mat(white));torso.scale.set(.9,1.05,.58);torso.position.y=1.58;root.add(torso);const chest=new T.Mesh(new T.SphereGeometry(.5,20,14),mat(white));chest.scale.set(1.05,.72,.62);chest.position.y=1.8;root.add(chest);head=new T.Mesh(new T.SphereGeometry(.28,20,14),mat(skin));head.scale.set(.88,1.08,.88);head.position.y=2.42;root.add(head);const hb=new T.Mesh(new T.SphereGeometry(.31,18,14),mat(hair));hb.scale.set(1,1.2,.95);hb.position.set(0,2.45,-.08);root.add(hb);const face=new T.Mesh(new T.SphereGeometry(.265,20,14),mat(skin));face.scale.set(.88,1.02,.82);face.position.set(0,2.42,.08);root.add(face);const pony=cap(1.05,.13,hair);pony.position.set(0,1.95,-.28);root.add(pony);function arm(side){const g=new T.Group();g.position.set(.52*side,1.9,0);root.add(g);const u=cap(.62,.115,skin);u.position.y=-.28;g.add(u);const e=new T.Group();e.position.y=-.6;g.add(e);const f=cap(.55,.105,black);f.position.y=-.25;e.add(f);const glove=new T.Mesh(new T.SphereGeometry(.19,16,12),mat(red));glove.position.set(0,-.58,.04);glove.scale.set(1.15,.95,1.2);e.add(glove);return{grp:g,elbow:e}}L=arm(-1);R=arm(1);function leg(side){const g=new T.Group();g.position.set(.23*side,.8,0);root.add(g);const th=cap(.72,.16,black);th.position.y=-.34;g.add(th);const sh=cap(.68,.135,skin);sh.position.y=-1.02;g.add(sh)}leg(-1);leg(1);reset();threeReady=true;$('status').textContent='3D READY';function loop(){requestAnimationFrame(loop);if(!on&&root)root.position.y=.08+Math.sin(performance.now()*.002)*.018;renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}catch(e){$('status').textContent='GAME READY / 3D ERROR';console.error(e)}};window.threeFail=function(){$('status').textContent='GAME READY / 3D LOAD ERROR'}})();</script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.161.0/three.min.js" onload="initThree()" onerror="threeFail()"></script></body></html>
