<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>JAB MOTION TEST</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}.ring{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#31405c,#111827 45%,#05070c 80%);display:flex;align-items:center;justify-content:center}.sprite{width:min(88vw,430px);aspect-ratio:300/340;background-image:url('assets/jab_sprite.svg');background-repeat:no-repeat;background-size:500% 100%;background-position:0 0;filter:drop-shadow(0 22px 25px #000);transform:translateY(-2vh) scale(1.02)}.sprite.idle{animation:breathe 1.4s ease-in-out infinite}.hit{position:fixed;left:64%;top:40%;width:24px;height:24px;border:5px solid white;border-radius:50%;opacity:0;transform:translate(-50%,-50%)}.hit.on{animation:impact .2s ease}.hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;z-index:3;display:flex;justify-content:space-between;font-weight:900}.tag{font-size:12px;color:#ff9aaa}.controls{position:fixed;z-index:4;bottom:max(16px,env(safe-area-inset-bottom));left:16px;right:16px;display:flex;justify-content:center}.controls button{width:min(82vw,360px);height:72px;border:1px solid #ff7688;border-radius:18px;background:linear-gradient(#bd2940,#7d1023);color:#fff;font-size:22px;font-weight:900}.note{position:fixed;z-index:4;bottom:100px;left:0;right:0;text-align:center;font-size:11px;color:#cbd5e1}@keyframes breathe{0%,100%{transform:translateY(-2vh) scale(1.02)}50%{transform:translateY(-1vh) scale(1.025)}}@keyframes impact{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(4)}}</style></head><body><div class="ring"><div id="sprite" class="sprite idle"></div></div><div class="hud"><span>JAB MOTION TEST</span><span id="state" class="tag">READY</span></div><div id="hit" class="hit"></div><div class="note">タップすると5フレームを約0.33秒で再生</div><div class="controls"><button id="jab">🥊 ジャブを打つ</button></div><script>const s=document.getElementById('sprite'),st=document.getElementById('state'),hit=document.getElementById('hit'),btn=document.getElementById('jab');const seq=[0,1,2,3,4],delay=[60,55,70,65,75];let busy=false;function frame(n){s.style.backgroundPosition=(n*25)+'% 0'}function jab(){if(busy)return;busy=true;s.classList.remove('idle');st.textContent='JAB!';let i=0;function next(){frame(seq[i]);if(i===2){hit.classList.remove('on');void hit.offsetWidth;hit.classList.add('on');if(navigator.vibrate)navigator.vibrate(18)}i++;if(i<seq.length)setTimeout(next,delay[i-1]);else setTimeout(()=>{frame(0);s.classList.add('idle');st.textContent='READY';busy=false},85)}next()}btn.onpointerdown=e=>{e.preventDefault();jab()};document.querySelector('.ring').onpointerdown=jab;</script></body></html>
