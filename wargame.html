<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>TACTICAL FRONT v0.2.1</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#111712;color:#e9eee5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;overflow:hidden;touch-action:manipulation}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.top{padding:max(8px,env(safe-area-inset-top)) 9px 7px;background:#101610;border-bottom:1px solid #53604e;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.side{font-size:10px;font-weight:900}.red{text-align:right;color:#ff8b82}.blue{color:#8bc8ff}.turn{text-align:center;font-weight:1000;font-size:13px}.mapWrap{position:relative;overflow:hidden;background:#53694b}.map{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(11,1fr);padding:4px;gap:2px;background:linear-gradient(145deg,#637957,#485f44)}.cell{position:relative;border:1px solid #ffffff12;background:#657b58}.cell:nth-child(7n+2),.cell:nth-child(11n+4){background:#455f3d}.cell:nth-child(13n+5){background:#80765a}.cell.road{background:#77735c}.cell.objective:after{content:'★';position:absolute;right:2px;top:0;color:#ffe17a;font-size:12px}.unit{position:absolute;z-index:4;width:9.6%;height:6.5%;transform:translate(-50%,-50%);border:2px solid #d9e5d4;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:1000;box-shadow:0 2px 5px #0009;transition:left .25s,top .25s,transform .15s}.blueU{background:#2566a5}.redU{background:#a63a32}.selected{outline:3px solid #ffe36e;transform:translate(-50%,-50%) scale(1.12)}.done{opacity:.48}.moved:after{content:'M';position:absolute;right:-4px;top:-7px;background:#f0c64d;color:#111;border-radius:50%;font-size:7px;width:12px;height:12px;text-align:center;line-height:12px}.hp{position:absolute;bottom:-5px;left:0;height:3px;background:#68e46f}.panel{background:#101610;border-top:1px solid #53604e;padding:7px 8px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto;gap:6px;min-height:116px}.info{font-size:10px;line-height:1.4}.info b{font-size:13px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:170px}.buttons button{border:1px solid #74806f;border-radius:7px;background:#273226;color:#fff;font-weight:900;font-size:10px}.buttons .end{grid-column:1/3;background:#6e5222;border-color:#b99755}.log{position:absolute;z-index:8;left:8px;right:8px;top:8px;text-align:center;pointer-events:none}.toast{display:inline-block;background:#0a0d09df;border:1px solid #9ba694;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:900;opacity:0;transition:.2s}.toast.on{opacity:1}.win{position:fixed;z-index:20;inset:0;background:#080b08df;display:none;align-items:center;justify-content:center}.card{background:#182019;border:1px solid #87947f;border-radius:12px;padding:25px;text-align:center}.card button{padding:12px 30px;background:#315e87;color:#fff;border:0;border-radius:8px;font-weight:900}</style></head><body><div class="app"><header class="top"><div class="side blue">BLUE FORCE<br><span id="blueCount"></span></div><div class="turn">TURN <span id="turn">1</span><br><small id="phase">YOUR PHASE</small></div><div class="side red">RED FORCE<br><span id="redCount"></span></div></header><main class="mapWrap"><div id="map" class="map"></div><div class="log"><span id="toast" class="toast"></span></div></main><footer class="panel"><div id="info" class="info"><b>任務：中央拠点を確保</b><br>部隊を選択→移動→そのまま攻撃可能。砲兵は射程3、迫撃砲は射程2。</div><div class="buttons"><button id="attackBtn">攻撃</button><button id="waitBtn">待機</button><button id="endBtn" class="end">ターン終了</button></div></footer></div><div id="win" class="win"><div class="card"><h1 id="result"></h1><p id="resultText"></p><button onclick="resetGame()">NEW GAME</button></div></div><script>const map=document.getElementById('map'),info=document.getElementById('info'),toast=document.getElementById('toast'),blueCount=document.getElementById('blueCount'),redCount=document.getElementById('redCount'),phase=document.getElementById('phase'),win=document.getElementById('win'),result=document.getElementById('result'),resultText=document.getElementById('resultText'),cols=9,rows=11,objective={x:4,y:5};let turn=1,selected=null,busy=false;const mk=(id,side,type,x,y,hp,atk,mv,range=1)=>({id,side,type,x,y,hp,maxHp:hp,atk,mv,range,moved:false,done:false});let units=[mk('B1','B','歩兵',1,9,10,4,2),mk('B2','B','戦車',3,10,14,7,3),mk('B3','B','偵察',7,9,8,3,4),mk('B4','B','砲兵',5,10,8,6,1,3),mk('B5','B','迫撃砲',2,8,7,5,2,2),mk('B6','B','工兵',6,8,10,4,2),mk('R1','R','歩兵',2,1,10,4,2),mk('R2','R','戦車',5,1,14,7,3),mk('R3','R','偵察',7,2,8,3,4),mk('R4','R','砲兵',4,2,8,6,1,3),mk('R5','R','歩兵',4,4,10,4,2),mk('R6','R','工兵',6,3,10,4,2)];function center(x,y){return{l:(x+.5)/cols*100,t:(y+.5)/rows*100}}function dist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}function occ(x,y){return units.find(u=>u.x===x&&u.y===y)}function msg(s){toast.textContent=s;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1000)}function render(){document.querySelectorAll('.mapWrap>.unit').forEach(n=>n.remove());map.innerHTML='';for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let c=document.createElement('div');c.className='cell'+(((x===4||x===5)&&y>1)?' road':'')+(x===4&&y===5?' objective':'');c.onclick=()=>moveTo(x,y);map.appendChild(c)}units.forEach(u=>{let d=document.createElement('div'),p=center(u.x,u.y);d.className='unit '+(u.side==='B'?'blueU':'redU')+(selected===u?' selected':'')+(u.done?' done':'')+(u.moved&&!u.done?' moved':'');d.style.left=p.l+'%';d.style.top=p.t+'%';d.innerHTML=`${u.type}<small>${u.id}</small><i class="hp" style="width:${Math.max(0,u.hp/u.maxHp*100)}%"></i>`;d.onclick=e=>{e.stopPropagation();selectUnit(u)};map.parentElement.appendChild(d)});blueCount.textContent=units.filter(u=>u.side==='B').length+' UNITS';redCount.textContent=units.filter(u=>u.side==='R').length+' CONTACTS';save()}function selectUnit(u){if(busy)return;if(u.side==='R'){if(selected&&selected.side==='B'&&dist(selected,u)<=selected.range){selected.targetId=u.id;msg(`${u.id}を攻撃対象に指定`)}else msg(`${u.id} ${u.type} HP ${u.hp}`);return}if(u.done){msg('この部隊は行動済み');return}selected=u;info.innerHTML=`<b>${u.id} ${u.type}</b><br>HP ${u.hp}/${u.maxHp}　攻撃 ${u.atk}　移動 ${u.mv}　射程 ${u.range}<br>${u.moved?'移動済み：攻撃または待機できます':'移動してから攻撃できます'}`;render()}function moveTo(x,y){if(!selected||busy||selected.done)return;if(selected.moved){msg('移動は1回まで。攻撃か待機を選択');return}if(occ(x,y)){msg('そのマスには部隊がいる');return}let d=Math.abs(x-selected.x)+Math.abs(y-selected.y);if(d>selected.mv){msg('移動範囲外');return}selected.x=x;selected.y=y;selected.moved=true;msg(`${selected.id} 移動完了 → 攻撃可能`);info.innerHTML=`<b>${selected.id} ${selected.type}</b><br>移動済み。射程内の敵をタップして「攻撃」、または待機。`;render();checkObjective()}function doAttack(){if(!selected||selected.done){msg('行動可能な青軍部隊を選択');return}let targets=units.filter(e=>e.side==='R'&&dist(selected,e)<=selected.range);let e=selected.targetId?targets.find(t=>t.id===selected.targetId):targets[0];if(!e){msg(`射程${selected.range}以内に敵がいない`);return}let dmg=Math.max(1,selected.atk+Math.floor(Math.random()*3)-2);e.hp-=dmg;selected.done=true;msg(`${selected.id} → ${e.id}  ${dmg} DAMAGE`);if(e.hp<=0){units=units.filter(x=>x!==e);setTimeout(()=>msg(`${e.id} 撃破`),150)}selected=null;render();checkEnd()}function doWait(){if(selected){selected.done=true;selected=null;render();msg('行動終了')}}function enemyPhase(){busy=true;phase.textContent='ENEMY PHASE';let reds=units.filter(u=>u.side==='R'),i=0;function step(){if(i>=reds.length){units.filter(u=>u.side==='B').forEach(u=>{u.done=false;u.moved=false;delete u.targetId});turn++;document.getElementById('turn').textContent=turn;phase.textContent='YOUR PHASE';busy=false;render();checkEnd();return}let r=reds[i++];if(!units.includes(r))return setTimeout(step,150);let bs=units.filter(u=>u.side==='B');if(!bs.length)return checkEnd();bs.sort((a,b)=>dist(r,a)-dist(r,b));let t=bs[0];if(dist(r,t)<=r.range){let dmg=Math.max(1,r.atk+Math.floor(Math.random()*3)-2);t.hp-=dmg;msg(`${r.id} → ${t.id}: ${dmg}`);if(t.hp<=0)units=units.filter(x=>x!==t)}else{let dx=Math.sign(t.x-r.x),dy=Math.sign(t.y-r.y),nx=r.x,ny=r.y;if(Math.abs(t.x-r.x)>=Math.abs(t.y-r.y))nx+=dx;else ny+=dy;if(nx>=0&&nx<cols&&ny>=0&&ny<rows&&!occ(nx,ny)){r.x=nx;r.y=ny}if(units.includes(t)&&dist(r,t)<=r.range){let dmg=Math.max(1,r.atk+Math.floor(Math.random()*3)-2);t.hp-=dmg;msg(`${r.id} 移動後攻撃 → ${t.id}: ${dmg}`);if(t.hp<=0)units=units.filter(x=>x!==t)}}render();checkEnd();setTimeout(step,430)}step()}function checkObjective(){if(units.some(u=>u.side==='B'&&u.x===4&&u.y===5))msg('中央拠点を確保！')}function checkEnd(){let b=units.filter(u=>u.side==='B'),r=units.filter(u=>u.side==='R');if(!b.length)return finish(false);if(!r.length)return finish(true);let o=b.find(u=>u.x===4&&u.y===5);if(o&&o.held)return finish(true);b.forEach(u=>{if(u.x===4&&u.y===5)u.held=true})}function finish(w){busy=true;win.style.display='flex';result.textContent=w?'MISSION COMPLETE':'MISSION FAILED';resultText.textContent=w?'敵を排除／中央拠点を確保した。':'青軍戦力が全滅した。'}function save(){localStorage.setItem('tacticalFrontV2',JSON.stringify({turn,units}))}function load(){try{let s=JSON.parse(localStorage.getItem('tacticalFrontV2'));if(s?.units){turn=s.turn;units=s.units;document.getElementById('turn').textContent=turn}}catch(e){}}function resetGame(){localStorage.removeItem('tacticalFrontV2');location.reload()}document.getElementById('attackBtn').addEventListener('click',doAttack);document.getElementById('waitBtn').addEventListener('click',doWait);document.getElementById('endBtn').addEventListener('click',()=>{if(!busy){selected=null;enemyPhase()}});load();render();</script></body></html>
