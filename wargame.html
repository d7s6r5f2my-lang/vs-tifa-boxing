<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>TACTICAL FRONT</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#111712;color:#e9eee5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;overflow:hidden;touch-action:manipulation}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:#182019}.top{padding:max(8px,env(safe-area-inset-top)) 10px 8px;background:#101610;border-bottom:1px solid #53604e;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.side{font-size:11px;font-weight:900}.red{text-align:right;color:#ff8b82}.blue{color:#8bc8ff}.turn{text-align:center;font-weight:1000;font-size:14px}.mapWrap{position:relative;overflow:hidden;background:#53694b}.map{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(10,1fr);padding:5px;gap:2px;background:linear-gradient(145deg,#637957,#485f44)}.cell{position:relative;border:1px solid #ffffff12;background:#657b58}.cell:nth-child(7n+2),.cell:nth-child(11n+4){background:#455f3d}.cell:nth-child(13n+5){background:#80765a}.cell.road{background:#77735c}.cell.objective:after{content:'★';position:absolute;right:3px;top:1px;color:#ffe17a;font-size:13px}.unit{position:absolute;z-index:4;width:10.7%;height:7.5%;transform:translate(-50%,-50%);border:2px solid #d9e5d4;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:1000;box-shadow:0 2px 5px #0009;transition:left .28s,top .28s,transform .15s}.unit.blueU{background:#2566a5}.unit.redU{background:#a63a32}.unit.selected{outline:3px solid #ffe36e;transform:translate(-50%,-50%) scale(1.12)}.unit.done{opacity:.55}.hp{position:absolute;bottom:-6px;left:0;height:3px;background:#68e46f}.fog{filter:brightness(.55)}.panel{background:#101610;border-top:1px solid #53604e;padding:7px 8px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto;gap:7px;min-height:112px}.info{font-size:11px;line-height:1.45}.info b{font-size:14px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:165px}.buttons button{border:1px solid #74806f;border-radius:7px;background:#273226;color:#fff;font-weight:900;font-size:11px}.buttons .end{grid-column:1/3;background:#6e5222;border-color:#b99755}.log{position:absolute;z-index:8;left:8px;right:8px;top:8px;text-align:center;pointer-events:none}.toast{display:inline-block;background:#0a0d09df;border:1px solid #9ba694;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:900;opacity:0;transition:.2s}.toast.on{opacity:1}.win{position:fixed;z-index:20;inset:0;background:#080b08df;display:none;align-items:center;justify-content:center}.card{background:#182019;border:1px solid #87947f;border-radius:12px;padding:25px;text-align:center}.card button{padding:12px 30px;background:#315e87;color:#fff;border:0;border-radius:8px;font-weight:900}</style></head><body><div class="app"><header class="top"><div class="side blue">BLUE FORCE<br><span id="blueCount">3 UNITS</span></div><div class="turn">TURN <span id="turn">1</span><br><small id="phase">YOUR PHASE</small></div><div class="side red">RED FORCE<br><span id="redCount">3 CONTACTS</span></div></header><main class="mapWrap"><div id="map" class="map"></div><div class="log"><span id="toast" class="toast"></span></div></main><footer class="panel"><div id="info" class="info"><b>任務：中央拠点を確保</b><br>青軍部隊をタップして選択。隣接マスをタップして移動。敵に隣接して「攻撃」。</div><div class="buttons"><button id="attack">攻撃</button><button id="wait">待機</button><button id="end" class="end">ターン終了</button></div></footer></div><div id="win" class="win"><div class="card"><h1 id="result"></h1><p id="resultText"></p><button onclick="resetGame()">NEW GAME</button></div></div><script>
const map=document.getElementById('map'), info=document.getElementById('info'),toast=document.getElementById('toast');const cols=8,rows=10;let turn=1,selected=null,busy=false;const objective={x:4,y:5};let units=[{id:'B1',side:'B',type:'歩兵',x:2,y:8,hp:10,atk:4,mv:2,done:false},{id:'B2',side:'B',type:'機甲',x:4,y:9,hp:12,atk:6,mv:2,done:false},{id:'B3',side:'B',type:'偵察',x:6,y:8,hp:8,atk:3,mv:3,done:false},{id:'R1',side:'R',type:'歩兵',x:3,y:2,hp:10,atk:4,mv:2},{id:'R2',side:'R',type:'機甲',x:5,y:2,hp:12,atk:6,mv:2},{id:'R3',side:'R',type:'歩兵',x:4,y:4,hp:10,atk:4,mv:2}];function key(x,y){return y*cols+x}function cellCenter(x,y){return{l:(x+.5)/cols*100,t:(y+.5)/rows*100}}function occ(x,y){return units.find(u=>u.x===x&&u.y===y)}function msg(s){toast.textContent=s;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),900)}function render(){map.innerHTML='';for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let c=document.createElement('div');c.className='cell'+(((x===3||x===4)&&y>1)?' road':'')+(x===objective.x&&y===objective.y?' objective':'');c.dataset.x=x;c.dataset.y=y;c.onclick=()=>moveTo(x,y);map.appendChild(c)}units.forEach(u=>{let d=document.createElement('div'),p=cellCenter(u.x,u.y);d.className='unit '+(u.side==='B'?'blueU':'redU')+(selected===u?' selected':'')+(u.done?' done':'');d.style.left=p.l+'%';d.style.top=p.t+'%';d.innerHTML=`${u.type}<small>${u.id}</small><i class="hp" style="width:${Math.max(0,u.hp/12*100)}%"></i>`;d.onclick=e=>{e.stopPropagation();selectUnit(u)};map.parentElement.appendChild(d);setTimeout(()=>{if(!document.body.contains(d))return},0)});document.querySelectorAll('.mapWrap>.unit').forEach(n=>n.remove());units.forEach(u=>{let d=document.createElement('div'),p=cellCenter(u.x,u.y);d.className='unit '+(u.side==='B'?'blueU':'redU')+(selected===u?' selected':'')+(u.done?' done':'');d.style.left=p.l+'%';d.style.top=p.t+'%';d.innerHTML=`${u.type}<small>${u.id}</small><i class="hp" style="width:${Math.max(0,u.hp/12*100)}%"></i>`;d.onclick=e=>{e.stopPropagation();selectUnit(u)};map.parentElement.appendChild(d)});document.getElementById('blueCount').textContent=units.filter(u=>u.side==='B').length+' UNITS';document.getElementById('redCount').textContent=units.filter(u=>u.side==='R').length+' CONTACTS';save()}function selectUnit(u){if(busy)return;if(u.side==='R'){if(selected)msg(`${u.id} ${u.type} HP ${u.hp}`);return}if(u.done){msg('この部隊は行動済み');return}selected=u;info.innerHTML=`<b>${u.id} ${u.type}</b><br>HP ${u.hp} / 攻撃 ${u.atk} / 移動 ${u.mv}<br>隣接マスをタップして移動`;render()}function moveTo(x,y){if(!selected||busy)return;if(occ(x,y)){msg('そのマスには部隊がいる');return}let dist=Math.abs(x-selected.x)+Math.abs(y-selected.y);if(dist>selected.mv){msg('移動範囲外');return}selected.x=x;selected.y=y;selected.done=true;msg(`${selected.id} 移動`);selected=null;render();checkObjective()}function adjacentEnemies(u){return units.filter(e=>e.side!==u.side&&Math.abs(e.x-u.x)+Math.abs(e.y-u.y)===1)}function attack(){if(!selected||selected.done){msg('攻撃する青軍部隊を選択');return}let es=adjacentEnemies(selected);if(!es.length){msg('隣接する敵がいない');return}let e=es[0],dmg=Math.max(1,selected.atk+Math.floor(Math.random()*3)-2);e.hp-=dmg;selected.done=true;msg(`${selected.id} → ${e.id}  ${dmg} DAMAGE`);if(e.hp<=0){units=units.filter(x=>x!==e);msg(`${e.id} 撃破`)}selected=null;render();checkEnd()}function wait(){if(selected){selected.done=true;selected=null;render();msg('待機')}}function enemyPhase(){busy=true;document.getElementById('phase').textContent='ENEMY PHASE';let reds=units.filter(u=>u.side==='R');let i=0;function step(){if(i>=reds.length){units.filter(u=>u.side==='B').forEach(u=>u.done=false);turn++;document.getElementById('turn').textContent=turn;document.getElementById('phase').textContent='YOUR PHASE';busy=false;render();checkEnd();return}let r=reds[i++];if(!units.includes(r)){setTimeout(step,200);return}let bs=units.filter(u=>u.side==='B');if(!bs.length)return checkEnd();bs.sort((a,b)=>(Math.abs(a.x-r.x)+Math.abs(a.y-r.y))-(Math.abs(b.x-r.x)+Math.abs(b.y-r.y)));let t=bs[0],dist=Math.abs(t.x-r.x)+Math.abs(t.y-r.y);if(dist===1){let dmg=Math.max(1,r.atk+Math.floor(Math.random()*3)-2);t.hp-=dmg;msg(`${r.id} attacks ${t.id}: ${dmg}`);if(t.hp<=0)units=units.filter(x=>x!==t)}else{let dx=Math.sign(t.x-r.x),dy=Math.sign(t.y-r.y),nx=r.x,ny=r.y;if(Math.abs(t.x-r.x)>=Math.abs(t.y-r.y))nx+=dx;else ny+=dy;if(nx>=0&&nx<cols&&ny>=0&&ny<rows&&!occ(nx,ny)){r.x=nx;r.y=ny}}render();checkEnd();setTimeout(step,520)}step()}function checkObjective(){let b=units.find(u=>u.side==='B'&&u.x===objective.x&&u.y===objective.y);if(b)msg('中央拠点を確保！ 1ターン保持せよ')}function checkEnd(){let b=units.filter(u=>u.side==='B'),r=units.filter(u=>u.side==='R');if(!b.length)return finish(false);if(!r.length)return finish(true);let onObj=b.find(u=>u.x===objective.x&&u.y===objective.y);if(onObj&&turn>=2&&onObj.held){finish(true)}b.forEach(u=>{if(u.x===objective.x&&u.y===objective.y)u.held=true})}function finish(win){busy=true;document.getElementById('win').style.display='flex';document.getElementById('result').textContent=win?'MISSION COMPLETE':'MISSION FAILED';document.getElementById('resultText').textContent=win?'敵を排除／中央拠点を確保した。':'青軍戦力が全滅した。'}function save(){localStorage.setItem('tacticalFront',JSON.stringify({turn,units}))}function resetGame(){localStorage.removeItem('tacticalFront');location.reload()}function load(){try{let s=JSON.parse(localStorage.getItem('tacticalFront'));if(s&&s.units){turn=s.turn;units=s.units;document.getElementById('turn').textContent=turn}}catch(e){}}document.getElementById('attack').onclick=attack;document.getElementById('wait').onclick=wait;document.getElementById('end').onclick=()=>{if(!busy){selected=null;enemyPhase()}};load();render();</script></body></html>
