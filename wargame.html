<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>TACTICAL FRONT v0.3.1</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#111712;color:#edf2e9;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.top{padding:max(7px,env(safe-area-inset-top)) 8px 6px;background:#101610;display:grid;grid-template-columns:1fr auto 1fr;border-bottom:1px solid #596452}.side{font-size:9px;font-weight:900}.blue{color:#8bc8ff}.red{color:#ff9189;text-align:right}.turn{text-align:center;font-size:12px;font-weight:1000}.money{font-size:12px;color:#ffe17a}.mapWrap{position:relative;overflow:hidden}.map{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(11,1fr);gap:2px;padding:4px;background:#4d6547}.cell{position:relative;border:1px solid #ffffff14;background:#687d5a}.cell:nth-child(8n+3){background:#4c6744}.road{background:#79755e!important}.facility{font-size:17px;text-align:center;padding-top:2px}.facility small{display:block;font-size:6px;color:#fff;text-shadow:0 1px 2px #000}.ownB{box-shadow:inset 0 0 0 3px #3d9cff}.ownR{box-shadow:inset 0 0 0 3px #e45248}.neutral{box-shadow:inset 0 0 0 2px #ddd}.cap{position:absolute;bottom:1px;left:2px;font-size:7px;color:#ffe17a}.unit{position:absolute;z-index:5;width:9.5%;height:6.3%;transform:translate(-50%,-50%);border:2px solid #e5eee1;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;font-weight:1000;box-shadow:0 2px 5px #0009}.blueU{background:#2566a5}.redU{background:#a63a32}.selected{outline:3px solid #ffe36e}.done{opacity:.5}.moved:after{content:'M';position:absolute;right:-4px;top:-6px;background:#f0c64d;color:#111;border-radius:50%;font-size:7px;width:11px;height:11px;text-align:center}.hp{position:absolute;bottom:-5px;left:0;height:3px;background:#6bea71}.panel{background:#101610;border-top:1px solid #596452;padding:6px 7px max(7px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 176px;gap:5px;min-height:120px}.info{font-size:9px;line-height:1.4}.info b{font-size:12px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:4px}.buttons button{border:1px solid #74806f;border-radius:6px;background:#293429;color:#fff;font-size:9px;font-weight:900}.end{grid-column:1/3;background:#6e5222!important}.toast{position:absolute;z-index:10;top:7px;left:50%;transform:translateX(-50%);background:#080b08e8;border:1px solid #9ba694;border-radius:6px;padding:6px 9px;font-size:10px;font-weight:900;opacity:0;pointer-events:none}.toast.on{opacity:1}.modal{position:fixed;z-index:30;inset:0;background:#050805dd;display:none;align-items:center;justify-content:center}.card{width:min(92vw,380px);background:#172018;border:1px solid #84917c;border-radius:12px;padding:14px}.shop{display:grid;grid-template-columns:1fr 1fr;gap:6px}.shop button,.card>button{padding:10px;background:#293829;color:#fff;border:1px solid #778571;border-radius:7px;font-weight:900}.close{width:100%;margin-top:8px}</style></head><body><div class="app"><header class="top"><div class="side blue">BLUE<br><span id="bc"></span><br><span class="money">¥<span id="bm">500</span></span></div><div class="turn">TURN <span id="tn">1</span><br><small id="phase">YOUR PHASE</small></div><div class="side red">RED<br><span id="rc"></span><br><span class="money">¥<span id="rm">500</span></span></div></header><main class="mapWrap"><div id="map" class="map"></div><div id="toast" class="toast"></div></main><footer class="panel"><div id="info" class="info"><b>敵本拠地を占領せよ</b><br>施設マスにも移動可能。都市＝毎ターン+50。工場/本拠地＝生産地点。</div><div class="buttons"><button id="atk">攻撃</button><button id="capBtn">占領</button><button id="wait">待機</button><button id="prod">生産</button><button id="end" class="end">ターン終了</button></div></footer></div><div id="modal" class="modal"><div class="card"><b>部隊生産</b><p style="font-size:10px">選択した自軍本拠地/工場に隣接して配置</p><div id="shop" class="shop"></div><button class="close" onclick="modal.style.display='none'">閉じる</button></div></div><script>const C=9,R=11,map=document.getElementById('map'),info=document.getElementById('info'),toast=document.getElementById('toast'),phase=document.getElementById('phase'),modal=document.getElementById('modal');let turn=1,budget={B:500,R:500},selected=null,selectedFacility=null,busy=false,nextId=20;const stats={歩兵:[10,4,2,1,100],戦車:[14,7,3,1,300],偵察:[8,3,4,1,150],砲兵:[8,6,1,3,350],迫撃砲:[7,5,2,2,200],工兵:[10,4,2,1,150]};const U=(id,s,t,x,y)=>{let a=stats[t];return{id,side:s,type:t,x,y,hp:a[0],maxHp:a[0],atk:a[1],mv:a[2],range:a[3],moved:false,done:false}};let units=[U('B1','B','歩兵',2,9),U('B2','B','戦車',4,9),U('B3','B','工兵',6,9),U('R1','R','歩兵',2,1),U('R2','R','戦車',4,1),U('R3','R','工兵',6,1)];let facilities=[{id:'BH',type:'本拠地',x:4,y:10,owner:'B',cp:20},{id:'RH',type:'本拠地',x:4,y:0,owner:'R',cp:20},{id:'C1',type:'都市',x:1,y:7,owner:null,cp:20},{id:'C2',type:'都市',x:7,y:7,owner:null,cp:20},{id:'C3',type:'都市',x:1,y:3,owner:null,cp:20},{id:'C4',type:'都市',x:7,y:3,owner:null,cp:20},{id:'F1',type:'工場',x:3,y:6,owner:null,cp:20},{id:'F2',type:'工場',x:5,y:4,owner:null,cp:20}];function d(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}function occ(x,y){return units.find(u=>u.x===x&&u.y===y)}function fac(x,y){return facilities.find(f=>f.x===x&&f.y===y)}function msg(s){toast.textContent=s;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1000)}function ctr(x,y){return{l:(x+.5)/C*100,t:(y+.5)/R*100}}function render(){document.querySelectorAll('.mapWrap>.unit').forEach(n=>n.remove());map.innerHTML='';for(let y=0;y<R;y++)for(let x=0;x<C;x++){let f=fac(x,y),c=document.createElement('div');c.className='cell'+((x===4||y===5)?' road':'');if(f){c.classList.add('facility',f.owner==='B'?'ownB':f.owner==='R'?'ownR':'neutral');c.innerHTML=(f.type==='本拠地'?'🏰':f.type==='都市'?'🏙️':'🏭')+`<small>${f.type}</small><span class="cap">${f.cp}/20</span>`;c.onclick=()=>{if(selected)moveTo(f.x,f.y);else selectFacility(f)}}else c.onclick=()=>moveTo(x,y);map.appendChild(c)}units.forEach(u=>{let e=document.createElement('div'),p=ctr(u.x,u.y);e.className='unit '+(u.side==='B'?'blueU':'redU')+(selected===u?' selected':'')+(u.done?' done':'')+(u.moved&&!u.done?' moved':'');e.style.left=p.l+'%';e.style.top=p.t+'%';e.innerHTML=`${u.type}<small>${u.id}</small><i class="hp" style="width:${u.hp/u.maxHp*100}%"></i>`;e.onclick=v=>{v.stopPropagation();selectUnit(u)};map.parentElement.appendChild(e)});bc.textContent=units.filter(u=>u.side==='B').length+' UNITS';rc.textContent=units.filter(u=>u.side==='R').length+' UNITS';bm.textContent=budget.B;rm.textContent=budget.R;save()}function selectUnit(u){if(busy)return;if(u.side==='R'){if(selected&&d(selected,u)<=selected.range){selected.targetId=u.id;msg(u.id+'を攻撃対象に指定')}return}if(u.done)return msg('行動済み');selected=u;selectedFacility=null;info.innerHTML=`<b>${u.id} ${u.type}</b><br>HP ${u.hp}/${u.maxHp}　移動${u.mv}　射程${u.range}<br>${u.moved?'移動済み：攻撃/占領/待機':'施設マスにも移動可能'}`;render()}function selectFacility(f){selectedFacility=f;if(f.owner==='B')info.innerHTML=`<b>${f.type}（自軍）</b><br>${f.type==='都市'?'毎ターン予算+50':'ここから部隊を生産可能'}`;else info.innerHTML=`<b>${f.type} ${f.owner?'（敵軍）':'（中立）'}</b><br>占領値 ${f.cp}/20`;render()}function moveTo(x,y){if(!selected||selected.moved||selected.done)return;if(occ(x,y))return msg('部隊あり');if(d(selected,{x,y})>selected.mv)return msg('移動範囲外');selected.x=x;selected.y=y;selected.moved=true;let f=fac(x,y);msg(f?`${f.type}へ移動。歩兵/工兵は占領可能`:'移動完了');render()}function doAttack(){if(!selected||selected.done)return msg('部隊を選択');let ts=units.filter(u=>u.side==='R'&&d(selected,u)<=selected.range),t=ts.find(u=>u.id===selected.targetId)||ts[0];if(!t)return msg('射程内に敵なし');let dmg=Math.max(1,selected.atk+Math.floor(Math.random()*3)-2);t.hp-=dmg;selected.done=true;msg(`${t.id}に${dmg}ダメージ`);if(t.hp<=0)units=units.filter(u=>u!==t);selected=null;render();checkWin()}function capture(){if(!selected||selected.done||!['歩兵','工兵'].includes(selected.type))return msg('歩兵/工兵を選択');let f=fac(selected.x,selected.y);if(!f||f.owner==='B')return msg('占領可能な施設上にいない');let power=selected.type==='工兵'?15:10;f.cp-=power;selected.done=true;if(f.cp<=0){let old=f.owner;f.owner='B';f.cp=20;msg(f.type+'を占領！');if(f.type==='本拠地'&&old==='R')return finish(true)}else msg(`占領進行 ${f.cp}/20`);selected=null;render()}function doWait(){if(selected){selected.done=true;selected=null;render()}}function openProd(){if(!selectedFacility||selectedFacility.owner!=='B'||!['本拠地','工場'].includes(selectedFacility.type))return msg('自軍の本拠地/工場を選択');shop.innerHTML='';Object.entries(stats).forEach(([t,a])=>{let b=document.createElement('button');b.textContent=`${t} ¥${a[4]}`;b.onclick=()=>produce(t);shop.appendChild(b)});modal.style.display='flex'}function produce(t){let cost=stats[t][4];if(budget.B<cost)return msg('予算不足');let f=selectedFacility,spots=[[1,0],[-1,0],[0,1],[0,-1]].map(q=>({x:f.x+q[0],y:f.y+q[1]})).filter(p=>p.x>=0&&p.x<C&&p.y>=0&&p.y<R&&!occ(p.x,p.y));if(!spots.length)return msg('配置場所なし');let p=spots[0];budget.B-=cost;units.push(U('B'+nextId++,'B',t,p.x,p.y));modal.style.display='none';msg(t+'を生産');render()}function income(side){let n=facilities.filter(f=>f.owner===side&&f.type==='都市').length;budget[side]+=100+n*50;return 100+n*50}function enemyPhase(){busy=true;phase.textContent='ENEMY PHASE';let reds=units.filter(u=>u.side==='R'),i=0;function step(){if(i>=reds.length){let inc=income('B');units.filter(u=>u.side==='B').forEach(u=>{u.done=false;u.moved=false;delete u.targetId});turn++;tn.textContent=turn;phase.textContent='YOUR PHASE';busy=false;msg(`収入 +¥${inc}`);render();return}let r=reds[i++];if(!units.includes(r))return step();let bs=units.filter(u=>u.side==='B');if(!bs.length)return finish(false);bs.sort((a,b)=>d(r,a)-d(r,b));let t=bs[0];if(d(r,t)<=r.range){let dmg=Math.max(1,r.atk+Math.floor(Math.random()*3)-2);t.hp-=dmg;if(t.hp<=0)units=units.filter(u=>u!==t)}else{let nx=r.x,ny=r.y;if(Math.abs(t.x-r.x)>=Math.abs(t.y-r.y))nx+=Math.sign(t.x-r.x);else ny+=Math.sign(t.y-r.y);if(!occ(nx,ny)&&nx>=0&&nx<C&&ny>=0&&ny<R){r.x=nx;r.y=ny}}render();setTimeout(step,300)}step()}function checkWin(){if(!units.some(u=>u.side==='B'))finish(false)}function finish(w){busy=true;modal.style.display='flex';modal.querySelector('.card').innerHTML=`<h2>${w?'MISSION COMPLETE':'MISSION FAILED'}</h2><p>${w?'敵本拠地を占領した。':'青軍が全滅した。'}</p><button onclick="resetGame()">NEW GAME</button>`}function save(){localStorage.setItem('tfv3',JSON.stringify({turn,budget,units,facilities,nextId}))}function load(){try{let s=JSON.parse(localStorage.getItem('tfv3'));if(s){turn=s.turn;budget=s.budget;units=s.units;facilities=s.facilities;nextId=s.nextId||20;tn.textContent=turn}}catch(e){}}function resetGame(){localStorage.removeItem('tfv3');location.reload()}atk.onclick=doAttack;capBtn.onclick=capture;wait.onclick=doWait;prod.onclick=openProd;end.onclick=()=>{if(!busy){selected=null;income('R');enemyPhase()}};load();render();</script></body></html>
